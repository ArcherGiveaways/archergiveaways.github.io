<script>
/* =========================================================
   CONFIG
========================================================= */

const GOOGLE_CLIENT_ID =
  "263646768191-7854avn92k94rq8pbit809o0erq48grq.apps.googleusercontent.com";

const API_URL =
  "https://archer.arcdepths.workers.dev";

const DISCORD_INVITE =
  "https://discord.gg/p4k77YM92n";


/* =========================================================
   EVENTS
========================================================= */

const EVENTS = [

  {
    id: "rain-weekend",
    type: "rain",
    title: "Weekend Coin Rain",
    prize: 5000000,
    description: "Everyone receives an equal share.",
    time: "Ends in 42m"
  },

  {
    id: "giveaway-5m",
    type: "giveaway",
    title: "5M Coin Giveaway",
    prize: 5000000,
    description: "One winner receives the full prize.",
    time: "Ends in 1h 12m"
  },

  {
    id: "giveaway-millionaire",
    type: "giveaway",
    title: "Millionaire Drop",
    prize: 2500000,
    description: "One lucky winner receives the prize.",
    time: "Ends in 2h"
  },

  {
    id: "rain-community",
    type: "rain",
    title: "Community Rain",
    prize: 1000000,
    description: "The prize is divided evenly.",
    time: "Ends in 3h"
  },

  {
    id: "giveaway-starter",
    type: "giveaway",
    title: "Starter Giveaway",
    prize: 500000,
    description: "A community giveaway.",
    time: "Ends in 4h"
  }

];


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let selectedEvent = null;
let modalAction = null;


/* =========================================================
   LOCAL STORAGE
========================================================= */

function userKey(id) {
  return "archer_user_" + id;
}


function loadLocalUser(user) {

  let saved = null;

  try {
    saved = JSON.parse(
      localStorage.getItem(
        userKey(user.googleId)
      ) || "null"
    );
  } catch {
    saved = null;
  }

  return {
    ...user,

    coins:
      saved?.coins ?? 0,

    discordVerified:
      saved?.discordVerified ?? false,

    discordId:
      saved?.discordId ?? null,

    linkCode:
      saved?.linkCode ?? null,

    invites:
      saved?.invites ?? 0,

    enteredEvents:
      saved?.enteredEvents ?? []

  };
}


function saveLocalUser() {

  if (!currentUser) return;

  localStorage.setItem(
    userKey(currentUser.googleId),
    JSON.stringify({

      coins:
        currentUser.coins,

      discordVerified:
        currentUser.discordVerified,

      discordId:
        currentUser.discordId,

      linkCode:
        currentUser.linkCode,

      invites:
        currentUser.invites,

      enteredEvents:
        currentUser.enteredEvents

    })
  );

}


/* =========================================================
   API
========================================================= */

async function api(
  path,
  method = "GET",
  data = null
) {

  let url =
    API_URL + path;

  const options = {
    method,
    headers: {}
  };

  if (data !== null) {

    options.headers[
      "Content-Type"
    ] = "application/json";

    options.body =
      JSON.stringify(data);

  }

  const response =
    await fetch(
      url,
      options
    );

  let result = {};

  try {
    result =
      await response.json();
  } catch {
    result = {};
  }

  if (!response.ok) {

    throw new Error(
      result.error ||
      "Worker returned HTTP " +
      response.status
    );

  }

  return result;

}


/* =========================================================
   GOOGLE
========================================================= */

function initializeGoogle() {

  if (
    !window.google ||
    !window.google.accounts ||
    !window.google.accounts.id
  ) {

    setTimeout(
      initializeGoogle,
      200
    );

    return;

  }

  google.accounts.id.initialize({

    client_id:
      GOOGLE_CLIENT_ID,

    callback:
      handleGoogleCredential,

    auto_select:
      false

  });

}


function startGoogleLogin() {

  if (
    !window.google ||
    !window.google.accounts
  ) {

    showToast(
      "Google Sign-In is still loading."
    );

    return;

  }

  google.accounts.id.prompt();

}


async function handleGoogleCredential(response) {

  try {

    const payload =
      parseJwt(
        response.credential
      );

    currentUser =
      loadLocalUser({

        googleId:
          payload.sub,

        name:
          payload.name ||
          payload.given_name ||
          "Google User",

        email:
          payload.email ||
          "",

        picture:
          payload.picture ||
          "https://ui-avatars.com/api/?name=User"

      });

    /*
     * If the browser has no code yet,
     * create one.
     */

    if (!currentUser.linkCode) {

      currentUser.linkCode =
        generateLinkCode();

    }

    saveLocalUser();

    updateUI();

    closeModal();

    showToast(
      "Signed in successfully."
    );

    /*
     * Register this account with Cloudflare.
     */

    await registerAccount();

    /*
     * Immediately pull the server state.
     */

    await refreshAccount();

  } catch (error) {

    console.error(
      "Google login error:",
      error
    );

    showToast(
      "Google sign-in failed."
    );

  }

}


/* =========================================================
   ACCOUNT REGISTRATION
========================================================= */

async function registerAccount() {

  if (!currentUser) return;

  try {

    const result =
      await api(
        "/register",
        "POST",
        {

          code:
            currentUser.linkCode,

          googleId:
            currentUser.googleId,

          name:
            currentUser.name,

          email:
            currentUser.email,

          picture:
            currentUser.picture

        }
      );

    /*
     * Worker may return the stored account.
     */

    if (result.account) {

      applyServerAccount(
        result.account
      );

    }

    saveLocalUser();
    updateUI();

  } catch (error) {

    console.error(
      "Account registration failed:",
      error
    );

    showToast(
      "Could not connect to the Archer server."
    );

  }

}


/* =========================================================
   SERVER ACCOUNT
========================================================= */

function applyServerAccount(account) {

  if (!currentUser || !account)
    return;


  if (
    account.coins !== undefined
  ) {

    currentUser.coins =
      Number(account.coins) || 0;

  }


  if (
    account.discordVerified !== undefined
  ) {

    currentUser.discordVerified =
      Boolean(
        account.discordVerified
      );

  }


  if (
    account.discordId !== undefined
  ) {

    currentUser.discordId =
      account.discordId;

  }


  if (
    account.invites !== undefined
  ) {

    currentUser.invites =
      Number(account.invites) || 0;

  }


  if (
    account.linkCode
  ) {

    currentUser.linkCode =
      account.linkCode;

  }


  if (
    Array.isArray(
      account.enteredEvents
    )
  ) {

    currentUser.enteredEvents =
      account.enteredEvents;

  }

}


/* =========================================================
   REFRESH ACCOUNT
========================================================= */

async function refreshAccount() {

  if (!currentUser)
    return;

  try {

    const result =
      await api(
        "/account?googleId=" +
        encodeURIComponent(
          currentUser.googleId
        )
      );

    if (
      result.account
    ) {

      applyServerAccount(
        result.account
      );

      saveLocalUser();
      updateUI();

    }

  } catch (error) {

    console.warn(
      "Account refresh failed:",
      error
    );

  }

}


/* =========================================================
   COINS
========================================================= */

async function refreshCoins() {

  if (!currentUser)
    return;

  try {

    const result =
      await api(
        "/coins?googleId=" +
        encodeURIComponent(
          currentUser.googleId
        )
      );

    if (
      result.coins !== undefined
    ) {

      currentUser.coins =
        Number(result.coins) || 0;

      saveLocalUser();

      updateUI();

    }

  } catch (error) {

    console.warn(
      "Coin refresh failed:",
      error
    );

  }

}


/* =========================================================
   DISCORD VERIFICATION
========================================================= */

async function verifyDiscord() {

  if (!currentUser) {

    openLoginModal();

    return;

  }


  /*
   * Always check the server first.
   */

  await refreshAccount();


  if (
    currentUser.discordVerified
  ) {

    showToast(
      "Your Discord is already verified."
    );

    return;

  }


  /*
   * Make sure a code exists.
   */

  if (!currentUser.linkCode) {

    currentUser.linkCode =
      generateLinkCode();

  }


  /*
   * Store the code on Cloudflare.
   */

  try {

    await registerAccount();

  } catch (error) {

    console.error(error);

    showToast(
      "Could not create your verification code."
    );

    return;

  }


  showLinkModal();

}


function showLinkModal() {

  document.getElementById(
    "modalIcon"
  ).className =
    "fa-brands fa-discord";


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Verify your Discord";


  document.getElementById(
    "modalText"
  ).innerHTML =
    `
      Join the Archer Discord, then use
      <strong>/link YOUR-CODE</strong>.
      After running the command, come back here
      and click <strong>Check verification</strong>.
    `;


  const codeBox =
    document.getElementById(
      "linkCodeBox"
    );

  codeBox.style.display =
    "block";

  codeBox.textContent =
    currentUser.linkCode;


  document.getElementById(
    "modalPrimary"
  ).textContent =
    "Check verification";


  modalAction =
    async () => {

      await checkVerification();

    };


  document.getElementById(
    "overlay"
  ).classList.add(
    "open"
  );

}


/* =========================================================
   CHECK VERIFICATION
========================================================= */

async function checkVerification() {

  if (!currentUser)
    return;


  try {

    /*
     * IMPORTANT:
     *
     * The website does NOT mark the user verified.
     *
     * BotGhost's /link command does that through:
     *
     * POST /link
     *
     * The website only reads the result.
     */

    const result =
      await api(
        "/account?googleId=" +
        encodeURIComponent(
          currentUser.googleId
        )
      );


    if (
      result.account
    ) {

      applyServerAccount(
        result.account
      );

    }


    saveLocalUser();
    updateUI();


    if (
      currentUser.discordVerified
    ) {

      closeModal();

      showToast(
        "Discord verified successfully! ✓"
      );

      return;

    }


    showToast(
      "Discord is not verified yet. Run /link first."
    );

  } catch (error) {

    console.error(
      "Verification check failed:",
      error
    );

    showToast(
      "Could not check verification."
    );

  }

}


/* =========================================================
   ENTER EVENT
========================================================= */

function enterEvent(eventId) {

  selectedEvent =
    EVENTS.find(
      event =>
        event.id === eventId
    );


  if (!selectedEvent) {

    showToast(
      "Event not found."
    );

    return;

  }


  /*
   * LOGIN
   */

  if (!currentUser) {

    openLoginModal();

    return;

  }


  /*
   * DISCORD
   */

  if (
    !currentUser.discordVerified
  ) {

    showLinkModal();

    return;

  }


  /*
   * INVITES
   */

  if (
    Number(
      currentUser.invites || 0
    ) < 2
  ) {

    openInviteRequirement();

    return;

  }


  /*
   * ALREADY ENTERED
   */

  if (
    currentUser.enteredEvents.includes(
      selectedEvent.id
    )
  ) {

    showToast(
      "You're already entered in this event."
    );

    return;

  }


  /*
   * TEMPORARY FRONTEND ENTRY.
   *
   * Real event entry will later be moved
   * to the backend/owner system.
   */

  currentUser.enteredEvents.push(
    selectedEvent.id
  );

  saveLocalUser();


  showToast(
    "You're entered in " +
    selectedEvent.title +
    "!"
  );

}

    );

  ).textContent =
    progress + "%";

}


/* =========================================================
   VERIFICATION UI
========================================================= */

function updateVerification(
  verified
) {

  const status =
    document.getElementById(
      "verificationStatus"
    );

  const text =
    document.getElementById(
      "verificationText"
    );

  const button =
    document.getElementById(
      "verifyButton"
    );

  const menu =
    document.getElementById(
      "menuVerification"
    );


  if (verified) {

    status.classList.add(
      "verified"
    );

    text.textContent =
      "Verified";

    menu.textContent =
      "Verified";

    button.textContent =
      "Verified";

  } else {

    status.classList.remove(
      "verified"
    );

    text.textContent =
      "Not verified";

    menu.textContent =
      "Not verified";

    button.textContent =
      "Verify";

  }

}


/* =========================================================
   INVITE BAR
========================================================= */

function updateInviteBar(
  invites
) {

  const amount =
    Math.min(
      2,
      Math.max(
        0,
        Number(invites || 0)
      )
    );


  const percentage =
    (amount / 2) * 100;


  document.getElementById(
    "inviteBar"
  ).style.width =
    percentage + "%";


  document.getElementById(
    "inviteText"
  ).textContent =
    amount === 2
      ? "2 / 2 QUALIFIED"
      : amount + " / 2";

}

   PROFILE
========================================================= */

      "profileMenu"
    )

    );

function logout() {

  if (
    window.google &&

  );

/* =========================================================
   HELPERS
========================================================= */

function generateLinkCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code =
    "ARCHER-";


  for (
    let i = 0;
    i < 5;
    i++
  ) {

    code +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

  }


  return code;

}


function parseJwt(token) {

  const base64Url =
    token.split(".")[1];


  const base64 =
    base64Url
      .replace(/-/g, "+")
      .replace(/_/g, "/");


  const jsonPayload =
    decodeURIComponent(
      atob(base64)
        .split("")
        .map(
          character =>
            "%" +
            (
              "00" +
              character
                .charCodeAt(0)
                .toString(16)
            ).slice(-2)
        )
        .join("")
    );


  return JSON.parse(
    jsonPayload
  );

}


function formatNumber(number) {

  return Number(
    number || 0
  ).toLocaleString(
    "en-US"
  );

}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3500
    );

}


/* =========================================================
   START
========================================================= */

renderEvents();

updateUI();

initializeGoogle();


/*
 * Refresh server state every 30 seconds.
 *
 * This lets the website notice when BotGhost
 * has verified the Discord account.
 */

setInterval(
  () => {

    if (currentUser) {

      refreshAccount();

    }

  },
  30000
);

</script>
