<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archer Giveaways</title>
    <link rel="icon" href="favicon.ico">

    <script>
        (function () {

            const loggedIn =
                localStorage.getItem("archer_google_logged_in");

            if (loggedIn === "true") {

                window.location.replace("home/");

            } else {

                window.location.replace("login/");

            }

        })();
    </script>
</head>

<body>

    <p>Loading Archer Giveaways...</p>

</body>
</html>
