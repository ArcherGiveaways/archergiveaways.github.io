<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  const GOOGLE_CLIENT_ID =
    "263646768191-7854avn92k94rq8pbit809o0erq48grq.apps.googleusercontent.com";

  const API_URL =
    "https://archer.arcdepths.workers.dev";

  const DISCORD_INVITE =
    "https://discord.gg/p4k77YM92n";


  /* =========================================================
     STATE
  ========================================================= */

  let EVENTS = [];

  let currentUser = null;

  let selectedEvent = null;

  let modalAction = null;


  /* =========================================================
     LOCAL STORAGE
  ========================================================= */

  function userKey(id) {

    return "archer_user_" + id;

  }


  function loadLocalUser(
    user
  ) {

    let saved = null;


    try {

      saved =
        JSON.parse(
          localStorage.getItem(
            userKey(
              user.googleId
            )
          ) || "null"
        );

    } catch {

      saved = null;

    }


    return {

      ...user,

      coins:
        saved?.coins ?? 0,

      discordVerified:
        saved?.discordVerified ??
        false,

      discordId:
        saved?.discordId ??
        null,

      linkCode:
        saved?.linkCode ??
        null,

      enteredEvents:
        Array.isArray(
          saved?.enteredEvents
        )
          ? saved.enteredEvents
          : []

    };

  }


  function saveLocalUser() {

    if (!currentUser)
      return;


    localStorage.setItem(

      userKey(
        currentUser.googleId
      ),

      JSON.stringify({

        coins:
          currentUser.coins,

        discordVerified:
          currentUser.discordVerified,

        discordId:
          currentUser.discordId,

        linkCode:
          currentUser.linkCode,

        enteredEvents:
          currentUser.enteredEvents

      })

    );

  }


  /* =========================================================
     API
  ========================================================= */

  async function api(
    path,
    method = "GET",
    data = null
  ) {

    const options = {

      method,

      headers: {}

    };


    if (data !== null) {

      options.headers[
        "Content-Type"
      ] =
        "application/json";


      options.body =
        JSON.stringify(
          data
        );

    }


    const response =
      await fetch(
        API_URL + path,
        options
      );


    let result = {};


    try {

      result =
        await response.json();

    } catch {

      result = {};

    }


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Worker returned HTTP " +
        response.status
      );

    }


    return result;

  }


  /* =========================================================
     GOOGLE
  ========================================================= */

  function initializeGoogle() {

    if (

      !window.google ||
      !window.google.accounts ||
      !window.google.accounts.id

    ) {

      setTimeout(
        initializeGoogle,
        200
      );

      return;

    }


    google.accounts.id.initialize({

      client_id:
        GOOGLE_CLIENT_ID,

      callback:
        handleGoogleCredential,

      auto_select:
        false

    });

  }


  function startGoogleLogin() {

    if (

      !window.google ||
      !window.google.accounts

    ) {

      showToast(
        "Google Sign-In is still loading."
      );

      return;

    }


    google.accounts.id.prompt();

  }


  async function handleGoogleCredential(
    response
  ) {

    try {

      const payload =
        parseJwt(
          response.credential
        );


      currentUser =
        loadLocalUser({

          googleId:
            payload.sub,

          name:
            payload.name ||
            payload.given_name ||
            "Google User",

          email:
            payload.email ||
            "",

          picture:
            payload.picture ||
            "https://ui-avatars.com/api/?name=User"

        });


      if (
        !currentUser.linkCode
      ) {

        currentUser.linkCode =
          generateLinkCode();

      }


      saveLocalUser();

      updateUI();

      closeModal();


      showToast(
        "Signed in successfully."
      );


      await registerAccount();

      await refreshAccount();


    } catch (error) {

      console.error(
        "Google login error:",
        error
      );


      showToast(
        "Google sign-in failed."
      );

    }

  }


  /* =========================================================
     REGISTER ACCOUNT
  ========================================================= */

  async function registerAccount() {

    if (!currentUser)
      return;


    if (
      !currentUser.linkCode
    ) {

      currentUser.linkCode =
        generateLinkCode();

    }


    try {

      const result =
        await api(
          "/register",
          "POST",
          {

            code:
              currentUser.linkCode,

            googleId:
              currentUser.googleId,

            name:
              currentUser.name,

            email:
              currentUser.email,

            picture:
              currentUser.picture

          }
        );


      /*
        IMPORTANT:
        Always use the code returned
        by the Worker.
      */

      if (
        result.code
      ) {

        currentUser.linkCode =
          result.code;

      }


      if (
        result.account
      ) {

        applyServerAccount(
          result.account
        );

      }


      saveLocalUser();

      updateUI();


    } catch (error) {

      console.error(
        "Account registration failed:",
        error
      );


      showToast(
        "Could not connect to the Archer server."
      );

    }

  }


  /* =========================================================
     SERVER ACCOUNT
  ========================================================= */

  function applyServerAccount(
    account
  ) {

    if (
      !currentUser ||
      !account
    )
      return;


    if (
      account.name
    ) {

      currentUser.name =
        account.name;

    }


    if (
      account.email !==
      undefined
    ) {

      currentUser.email =
        account.email;

    }


    if (
      account.picture !==
      undefined
    ) {

      currentUser.picture =
        account.picture;

    }


    if (
      account.coins !==
      undefined
    ) {

      currentUser.coins =
        Number(
          account.coins
        ) || 0;

    }


    if (
      account.discordVerified !==
      undefined
    ) {

      currentUser.discordVerified =
        Boolean(
          account.discordVerified
        );

    }


    if (
      account.discordId !==
      undefined
    ) {

      currentUser.discordId =
        account.discordId;

    }


    if (
      account.linkCode !==
      undefined
    ) {

      currentUser.linkCode =
        account.linkCode;

    }


    if (
      Array.isArray(
        account.enteredEvents
      )
    ) {

      currentUser.enteredEvents =
        account.enteredEvents;

    }

  }


  /* =========================================================
     ACCOUNT REFRESH
  ========================================================= */

  async function refreshAccount() {

    if (!currentUser)
      return;


    try {

      const result =
        await api(

          "/account?googleId=" +
          encodeURIComponent(
            currentUser.googleId
          )

        );


      if (
        result.account
      ) {

        applyServerAccount(
          result.account
        );


        saveLocalUser();

        updateUI();

      }


    } catch (error) {

      console.warn(
        "Account refresh failed:",
        error
      );

    }

  }


  /* =========================================================
     DISCORD VERIFICATION
  ========================================================= */

  async function verifyDiscord() {

    if (!currentUser) {

      openLoginModal();

      return;

    }


    await refreshAccount();


    if (
      currentUser.discordVerified
    ) {

      showToast(
        "Your Discord is already verified."
      );

      return;

    }


    if (
      !currentUser.linkCode
    ) {

      currentUser.linkCode =
        generateLinkCode();

    }


    await registerAccount();

    showLinkModal();

  }


  function showLinkModal() {

    document.getElementById(
      "modalIcon"
    ).innerHTML =
      '<i class="fa-brands fa-discord"></i>';


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Verify your Discord";


    document.getElementById(
      "modalText"
    ).innerHTML =

      `Join the Archer Discord, then use
      <strong>/link ${escapeHtml(
        currentUser.linkCode
      )}</strong>.
      After running the command, come back here
      and click <strong>Check verification</strong>.`;


    const codeBox =
      document.getElementById(
        "linkCodeBox"
      );


    codeBox.style.display =
      "block";


    codeBox.textContent =
      currentUser.linkCode;


    document.getElementById(
      "modalPrimary"
    ).textContent =
      "Check verification";


    modalAction =
      async () => {

        await checkVerification();

      };


    document.getElementById(
      "overlay"
    ).classList.add(
      "open"
    );

  }


  async function checkVerification() {

    if (!currentUser)
      return;


    try {

      const result =
        await api(

          "/account?googleId=" +
          encodeURIComponent(
            currentUser.googleId
          )

        );


      if (
        result.account
      ) {

        applyServerAccount(
          result.account
        );

      }


      saveLocalUser();

      updateUI();


      if (
        currentUser.discordVerified
      ) {

        closeModal();


        showToast(
          "Discord verified successfully! ✓"
        );


        return;

      }


      showToast(
        "Discord is not verified yet. Run /link first."
      );


    } catch (error) {

      console.error(
        "Verification check failed:",
        error
      );


      showToast(
        "Could not check verification."
      );

    }

  }


  async function copyLinkCode() {

    if (

      !currentUser ||
      !currentUser.linkCode

    ) {

      return;

    }


    try {

      await navigator.clipboard.writeText(
        currentUser.linkCode
      );


      showToast(
        "Verification code copied!"
      );


    } catch {

      showToast(
        "Click and copy the code manually."
      );

    }

  }


  /* =========================================================
     EVENTS
  ========================================================= */

  async function fetchEvents() {

    try {

      const data =
        await api(
          "/events"
        );


      if (
        !Array.isArray(
          data.events
        )
      ) {

        return;

      }


      EVENTS =
        data.events
          .map(
            event => ({

              ...event,

              id:
                String(
                  event.id || ""
                ).trim(),

              type:
                event.type === "rain"
                  ? "rain"
                  : "giveaway",

              title:
                String(
                  event.title ||
                  "Untitled event"
                ),

              description:
                String(
                  event.description ||
                  ""
                ),

              prize:
                Number(
                  event.prize ||
                  0
                ),

              endsAt:
                event.endsAt
                  ? Number(
                      event.endsAt
                    )
                  : null

            })
          )
          .filter(
            event =>
              event.id
          );


      renderEvents();


    } catch (error) {

      console.warn(
        "Event fetch failed:",
        error
      );

    }

  }


  function getEventTime(
    event
  ) {

    if (
      event.endsAt
    ) {

      const remaining =
        Math.max(
          0,
          Number(
            event.endsAt
          ) -
          Date.now()
        );


      if (
        remaining <= 0
      ) {

        return "Ended";

      }


      const totalSeconds =
        Math.floor(
          remaining / 1000
        );


      const hours =
        Math.floor(
          totalSeconds / 3600
        );


      const minutes =
        Math.floor(
          (
            totalSeconds %
            3600
          ) / 60
        );


      const seconds =
        totalSeconds % 60;


      if (
        hours > 0
      ) {

        return (
          `Ends in ${hours}h ${minutes}m`
        );

      }


      if (
        minutes > 0
      ) {

        return (
          `Ends in ${minutes}m ${seconds}s`
        );

      }


      return (
        `Ends in ${seconds}s`
      );

    }


    return event.time || "";

  }


  function updateEventTimes() {

    document
      .querySelectorAll(
        "[data-event-id]"
      )
      .forEach(
        element => {

          const event =
            EVENTS.find(
              item =>
                item.id ===
                element.dataset.eventId
            );


          if (!event)
            return;


          element.textContent =
            getEventTime(
              event
            );

        }
      );

  }


  /* =========================================================
     EVENT BUTTON
  ========================================================= */

  function enterEvent(
    eventId
  ) {

    selectedEvent =
      EVENTS.find(
        event =>
          event.id ===
          eventId
      );


    if (!selectedEvent) {

      showToast(
        "Event not found."
      );

      return;

    }


    if (!currentUser) {

      openLoginModal();

      return;

    }


    if (
      !currentUser.discordVerified
    ) {

      showLinkModal();

      return;

    }


    showToast(
      "Google and Discord verified."
    );

  }


  /* =========================================================
     LOGIN MODAL
  ========================================================= */

  function openLoginModal() {

    document.getElementById(
      "modalIcon"
    ).innerHTML =
      '<i class="fa-solid fa-lock"></i>';


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Sign in required";


    document.getElementById(
      "modalText"
    ).textContent =
      "You need to sign in with Google before entering an event.";


    document.getElementById(
      "linkCodeBox"
    ).style.display =
      "none";


    document.getElementById(
      "modalPrimary"
    ).textContent =
      "Sign in";


    modalAction =
      () => {

        closeModal();


        setTimeout(
          startGoogleLogin,
          150
        );

      };


    document.getElementById(
      "overlay"
    ).classList.add(
      "open"
    );

  }


  function modalPrimaryAction() {

    if (
      modalAction
    ) {

      modalAction();

    }

  }


  function closeModal() {

    document.getElementById(
      "overlay"
    ).classList.remove(
      "open"
    );


    modalAction =
      null;

  }


  /* =========================================================
     UI
  ========================================================= */

  function updateUI() {

    const login =
      document.getElementById(
        "loginButton"
      );


    const profile =
      document.getElementById(
        "profileButton"
      );


    if (!currentUser) {

      login.style.display =
        "flex";


      profile.style.display =
        "none";


      document.getElementById(
        "accountAvatar"
      ).src =
        "https://ui-avatars.com/api/?name=Guest";


      document.getElementById(
        "accountName"
      ).textContent =
        "Not signed in";


      document.getElementById(
        "accountEmail"
      ).textContent =
        "Sign in to access giveaways";


      document.getElementById(
        "coinBalance"
      ).textContent =
        "0";


      document.getElementById(
        "menuCoins"
      ).textContent =
        "0";


      document.getElementById(
        "accountProgress"
      ).style.width =
        "0%";


      document.getElementById(
        "accountProgressText"
      ).textContent =
        "0%";


      updateVerification(
        false
      );


      return;

    }


    login.style.display =
      "none";


    profile.style.display =
      "flex";


    document.getElementById(
      "headerAvatar"
    ).src =
      currentUser.picture;


    document.getElementById(
      "headerName"
    ).textContent =
      currentUser.name
        .split(" ")[0];


    document.getElementById(
      "accountAvatar"
    ).src =
      currentUser.picture;


    document.getElementById(
      "accountName"
    ).textContent =
      currentUser.name;


    document.getElementById(
      "accountEmail"
    ).textContent =
      currentUser.email;


    document.getElementById(
      "coinBalance"
    ).textContent =
      formatNumber(
        currentUser.coins
      );


    document.getElementById(
      "menuCoins"
    ).textContent =
      formatNumber(
        currentUser.coins
      );


    document.getElementById(
      "menuName"
    ).textContent =
      currentUser.name;


    document.getElementById(
      "menuEmail"
    ).textContent =
      currentUser.email;


    updateVerification(
      currentUser.discordVerified
    );


    const progress =
      Math.min(
        100,

        Math.round(

          (
            Number(
              currentUser.coins ||
              0
            ) /
            5000000
          ) *
          100

        )
      );


    document.getElementById(
      "accountProgress"
    ).style.width =
      progress + "%";


    document.getElementById(
      "accountProgressText"
    ).textContent =
      progress + "%";

  }


  /* =========================================================
     VERIFICATION UI
  ========================================================= */

  function updateVerification(
    verified
  ) {

    const status =
      document.getElementById(
        "verificationStatus"
      );


    const text =
      document.getElementById(
        "verificationText"
      );


    const button =
      document.getElementById(
        "verifyButton"
      );


    const menu =
      document.getElementById(
        "menuVerification"
      );


    if (verified) {

      status.classList.add(
        "verified"
      );


      text.textContent =
        "Verified";


      menu.textContent =
        "Verified";


      menu.classList.add(
        "verified"
      );


      button.textContent =
        "Verified";


    } else {

      status.classList.remove(
        "verified"
      );


      text.textContent =
        "Not verified";


      menu.textContent =
        "Not verified";


      menu.classList.remove(
        "verified"
      );


      button.textContent =
        "Verify";

    }

  }


  /* =========================================================
     RENDER
  ========================================================= */

  function renderEvents() {

    renderSidebar();

    renderFeatured();

    renderGrid();

    updateEventTimes();

  }


  function renderSidebar() {

    const container =
      document.getElementById(
        "activeEvents"
      );


    if (!container)
      return;


    container.innerHTML =
      "";


    if (
      EVENTS.length === 0
    ) {

      container.innerHTML =

        `<div class="empty-state">
          No active events
        </div>`;

      return;

    }


    EVENTS.forEach(
      event => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "event-mini";


        item.innerHTML = `

          <div
            class="event-type ${event.type}"
          >

            <i class="fa-solid ${
              event.type === "rain"
                ? "fa-cloud-rain"
                : "fa-gift"
            }"></i>

            ${
              event.type === "rain"
                ? "Rain"
                : "Giveaway"
            }

          </div>


          <div class="event-name">

            ${escapeHtml(
              event.title
            )}

          </div>


          <div class="event-prize">

            ${formatNumber(
              event.prize
            )}
            Coins

          </div>


          <div
            class="event-time"
            data-event-id="${escapeHtml(
              event.id
            )}"
          >

            ${escapeHtml(
              getEventTime(
                event
              )
            )}

          </div>


          <button
            class="tiny-enter"
            onclick="enterEvent('${escapeHtml(
              event.id
            )}')"
            title="View"
          >

            <i class="fa-solid fa-arrow-right"></i>

          </button>

        `;


        container.appendChild(
          item
        );

      }
    );

  }


  function renderFeatured() {

    const featured =
      document.getElementById(
        "featured"
      );


    if (!featured)
      return;


    if (
      EVENTS.length === 0
    ) {

      featured.innerHTML = `

        <div class="featured-content">

          <div class="featured-label">

            <i class="fa-solid fa-clock"></i>

            Waiting for events

          </div>


          <div class="featured-title">

            No Active Events

          </div>


          <div class="featured-prize">

            Check back soon!

          </div>

        </div>

      `;

      return;

    }


    const biggest =
      [...EVENTS].sort(
        (a, b) =>
          b.prize -
          a.prize
      )[0];


    featured.innerHTML = `

      <div class="featured-content">

        <div class="featured-label">

          <i class="fa-solid fa-star"></i>

          Biggest active ${
            biggest.type === "rain"
              ? "rain"
              : "giveaway"
          }

        </div>


        <div class="featured-title">

          ${escapeHtml(
            biggest.title
          )}

        </div>


        <div class="featured-prize">

          ${formatNumber(
            biggest.prize
          )}

          Coins

        </div>


        <div class="featured-bottom">


          <div class="featured-pill">

            <i class="fa-regular fa-clock"></i>

            <span
              data-event-id="${escapeHtml(
                biggest.id
              )}"
            >

              ${escapeHtml(
                getEventTime(
                  biggest
                )
              )}

            </span>

          </div>


          <div class="featured-pill">

            ${
              biggest.type === "rain"
                ? "Equal share"
                : "Giveaway"
            }

          </div>


          <button
            class="featured-enter"
            onclick="enterEvent('${escapeHtml(
              biggest.id
            )}')"
          >

            View

            <i class="fa-solid fa-arrow-right"></i>

          </button>


        </div>

      </div>

    `;

  }


  function renderGrid() {

    const grid =
      document.getElementById(
        "eventsGrid"
      );


    if (!grid)
      return;


    grid.innerHTML =
      "";


    if (
      EVENTS.length === 0
    ) {

      grid.innerHTML = `

        <div
          class="empty-state"
          style="grid-column:1 / -1;"
        >

          No active giveaways or rains currently running.

        </div>

      `;

      return;

    }


    EVENTS.forEach(
      event => {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "event-card" +

          (
            event.prize >=
            5000000

              ? " featured-card"

              : ""

          );


        card.innerHTML = `

          <div
            class="card-event-type ${event.type}"
          >

            <i class="fa-solid ${
              event.type === "rain"
                ? "fa-cloud-rain"
                : "fa-gift"
            }"></i>

            ${
              event.type === "rain"
                ? "Rain"
                : "Giveaway"
            }

          </div>


          <div class="card-title">

            ${escapeHtml(
              event.title
            )}

          </div>


          <div class="card-prize">

            ${formatNumber(
              event.prize
            )}

          </div>


          <div class="card-description">

            ${escapeHtml(
              event.description
            )}

          </div>


          <div class="card-footer">

            <div
              class="card-time"
              data-event-id="${escapeHtml(
                event.id
              )}"
            >

              ${escapeHtml(
                getEventTime(
                  event
                )
              )}

            </div>


            <button
              class="card-enter"
              onclick="enterEvent('${escapeHtml(
                event.id
              )}')"
            >

              <i class="fa-solid fa-arrow-right"></i>

            </button>

          </div>

        `;


        grid.appendChild(
          card
        );

      }
    );

  }


  /* =========================================================
     PROFILE
  ========================================================= */

  function toggleProfile() {

    document
      .getElementById(
        "profileMenu"
      )
      .classList.toggle(
        "open"
      );

  }


  document.addEventListener(
    "click",
    event => {

      const area =
        document.querySelector(
          ".account-area"
        );


      if (
        area &&
        !area.contains(
          event.target
        )
      ) {

        document
          .getElementById(
            "profileMenu"
          )
          .classList.remove(
            "open"
          );

      }

    }
  );


  function logout() {

    currentUser =
      null;


    if (
      window.google &&
      google.accounts &&
      google.accounts.id
    ) {

      google.accounts.id
        .disableAutoSelect();

    }


    document
      .getElementById(
        "profileMenu"
      )
      .classList.remove(
        "open"
      );


    updateUI();


    showToast(
      "Signed out."
    );

  }


  /* =========================================================
     HELPERS
  ========================================================= */

  function generateLinkCode() {

    const chars =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let code =
      "ARCHER-";


    for (
      let i = 0;
      i < 5;
      i++
    ) {

      code +=
        chars[
          Math.floor(
            Math.random() *
            chars.length
          )
        ];

    }


    return code;

  }


  function parseJwt(
    token
  ) {

    const base64Url =
      token.split(".")[1];


    const base64 =
      base64Url
        .replace(
          /-/g,
          "+"
        )
        .replace(
          /_/g,
          "/"
        );


    const jsonPayload =
      decodeURIComponent(

        atob(base64)
          .split("")
          .map(
            character =>
              "%" +
              (
                "00" +
                character
                  .charCodeAt(0)
                  .toString(16)
              ).slice(-2)
          )
          .join("")

      );


    return JSON.parse(
      jsonPayload
    );

  }


  function formatNumber(
    number
  ) {

    return Number(
      number || 0
    ).toLocaleString(
      "en-US"
    );

  }


  function escapeHtml(
    value
  ) {

    return String(
      value
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function showToast(
    message
  ) {

    const toast =
      document.getElementById(
        "toast"
      );


    if (!toast)
      return;


    toast.textContent =
      message;


    toast.classList.add(
      "show"
    );


    clearTimeout(
      window.__toastTimer
    );


    window.__toastTimer =
      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        3500
      );

  }


  /* =========================================================
     INITIALIZATION
  ========================================================= */

  renderEvents();

  updateUI();

  initializeGoogle();

  fetchEvents();


  /* =========================================================
     LIVE EVENTS
  ========================================================= */

  setInterval(
    fetchEvents,
    1000
  );


  setInterval(
    updateEventTimes,
    1000
  );


  /* =========================================================
     ACCOUNT REFRESH
  ========================================================= */

  setInterval(
    () => {

      if (currentUser) {

        refreshAccount();

      }

    },
    30000
  );

</script>
