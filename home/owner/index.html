```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Home - Archer Giveaways</title>

    <link
        rel="icon"
        href="../../favicon.ico"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 15%,
                    rgba(88, 101, 242, 0.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(255, 90, 0, 0.08),
                    transparent 25%
                ),
                #0f1117;

            color: white;
        }

        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background:
                rgba(24, 27, 36, 0.94);

            border-bottom:
                1px solid #292e3a;

            backdrop-filter: blur(14px);

            position: sticky;
            top: 0;

            z-index: 100;
        }

        .brand {
            font-size: 20px;
            font-weight: 900;

            color: white;
            text-decoration: none;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-profile-box {
            position: relative;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 6px 14px;

            background: #101218;

            border:
                1px solid #292e3a;

            border-radius: 10px;

            cursor: pointer;
            user-select: none;

            transition: 0.2s ease;
        }

        .user-profile-box:hover {
            background: #1f2330;
            border-color: #5865f2;
        }

        .user-image {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid #5865f2;

            background: #20232d;
        }

        .user-name {
            font-size: 14px;

            max-width: 180px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =====================================================
           PROFILE DROPDOWN
        ===================================================== */

        .user-dropdown {
            display: none;

            position: absolute;

            top:
                calc(100% + 10px);

            right: 0;

            width: 330px;

            background: #181b24;

            border:
                1px solid #292e3a;

            border-radius: 16px;

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.55);

            z-index: 100;

            padding: 18px;
        }

        .user-dropdown.active {
            display: block;
        }

        .profile-header {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 16px;
        }

        .profile-header img {
            width: 52px;
            height: 52px;

            border-radius: 50%;

            object-fit: cover;

            background: #20232d;
        }

        .profile-header strong {
            display: block;

            font-size: 16px;

            margin-bottom: 3px;
        }

        .profile-header span {
            color: #9298a5;

            font-size: 12px;
        }

        .discord-section {
            padding-top: 15px;

            border-top:
                1px solid #292e3a;
        }

        .discord-title {
            font-size: 14px;

            font-weight: 800;

            margin-bottom: 6px;
        }

        .discord-status {
            font-size: 12px;

            color: #9298a5;

            margin-bottom: 12px;

            line-height: 1.5;
        }

        .discord-status.success {
            color: #6cff9b;
        }

        .discord-button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 11px 12px;

            background: #5865f2;

            color: white;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s ease;

            margin-top: 8px;
        }

        .discord-button:hover {
            background: #4752c4;

            transform:
                translateY(-1px);
        }

        .discord-button:disabled {
            opacity: 0.65;

            cursor: wait;

            transform: none;
        }

        .discord-button.cancel {
            background: #ef4444;
        }

        .discord-button.cancel:hover {
            background: #dc2626;
        }

        .discord-button.verify {
            background: #303642;
        }

        .discord-button.verify:hover {
            background: #3b4252;
        }

        .link-code-box {
            display: none;

            margin-top: 12px;

            padding: 14px;

            border:
                1px solid #343946;

            background: #101218;

            border-radius: 12px;

            text-align: center;
        }

        .link-code-box.active {
            display: block;
        }

        .link-code {
            font-size: 28px;

            letter-spacing: 7px;

            font-weight: 900;

            margin: 6px 0 4px;
        }

        .link-instructions {
            color: #a8adba;

            font-size: 12px;

            line-height: 1.5;
        }

        .link-timer {
            margin-top: 8px;

            font-size: 12px;

            font-weight: 800;

            color: #ffb86b;
        }

        .link-message {
            min-height: 18px;

            margin-top: 8px;

            font-size: 12px;

            text-align: center;
        }

        .link-message.success {
            color: #6cff9b;
        }

        .link-message.error {
            color: #ff6b6b;
        }

        .linked-discord-profile {
            display: none;

            align-items: center;

            gap: 10px;

            margin-top: 12px;

            padding: 10px;

            background: #101218;

            border:
                1px solid #292e3a;

            border-radius: 11px;
        }

        .linked-discord-profile.active {
            display: flex;
        }

        .linked-discord-profile img {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            object-fit: cover;
        }

        .linked-discord-profile strong {
            display: block;

            font-size: 13px;
        }

        .linked-discord-profile span {
            display: block;

            margin-top: 2px;

            font-size: 11px;

            color: #6cff9b;
        }

        .logout {
            margin-left: 10px;

            padding: 9px 15px;

            border: none;

            border-radius: 9px;

            background: #ef4444;

            color: white;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s ease;
        }

        .logout:hover {
            background: #dc2626;

            transform:
                translateY(-1px);
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                56px 30px 70px;
        }

        .dashboard {
            width: 100%;

            max-width: 1250px;
        }

        .eyebrow {
            text-align: center;

            color: #9298a5;

            font-size: 12px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 10px;
        }

        .dashboard-title {
            margin: 0;

            text-align: center;

            font-size: 36px;

            font-weight: 900;

            letter-spacing: -1px;
        }

        .dashboard-subtitle {
            max-width: 720px;

            margin:
                12px auto 32px;

            text-align: center;

            color: #9ca3af;

            line-height: 1.6;

            font-size: 14px;
        }

        /* =====================================================
           FIVE CARD LAYOUT
        ===================================================== */

        .cards {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 22px;
        }

        .card {
            position: relative;

            width: 100%;

            aspect-ratio:
                4 / 6;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding: 18px;

            background:
                linear-gradient(
                    180deg,
                    #1a1e28 0%,
                    #151821 100%
                );

            border:
                1px solid #292e3a;

            border-radius: 17px;

            isolation: isolate;

            transition:
                0.25s ease;
        }

        .card::before {
            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 21px;

            background:
                linear-gradient(
                    90deg,
                    #ff1600,
                    #ff4d00,
                    #ff9d00,
                    #ff3100,
                    #ff0800,
                    #ff7800,
                    #ff1a00
                );

            padding: 4px;

            -webkit-mask:
                linear-gradient(#000 0 0)
                content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite: xor;

            mask:
                linear-gradient(#000 0 0)
                content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;

            opacity: 0;

            pointer-events: none;

            z-index: -1;

            filter:
                drop-shadow(0 0 4px #ff3b00)
                drop-shadow(0 0 10px #ff1800)
                drop-shadow(0 0 18px #ff5a00);

            transition:
                opacity 0.25s ease;
        }

        .card::after {
            content: "";

            position: absolute;

            inset: -6px;

            border-radius: 23px;

            background:
                linear-gradient(
                    100deg,
                    transparent 0%,
                    transparent 15%,
                    #ff2100 25%,
                    #ff6500 32%,
                    #ffb300 38%,
                    #ff3b00 45%,
                    transparent 55%,
                    transparent 72%,
                    #ff1800 82%,
                    #ff7a00 91%,
                    transparent 100%
                );

            background-size:
                300% 100%;

            padding: 6px;

            -webkit-mask:
                linear-gradient(#000 0 0)
                content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite: xor;

            mask:
                linear-gradient(#000 0 0)
                content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;

            opacity: 0;

            pointer-events: none;

            z-index: -2;

            filter:
                blur(7px);
        }

        .card:hover {
            transform:
                translateY(-8px);

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.42);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover::after {
            opacity: 0.8;

            animation:
                lavaFlow 2.2s
                ease-in-out infinite;
        }

        @keyframes lavaFlow {

            0% {
                background-position:
                    100% 50%;
            }

            50% {
                background-position:
                    0% 50%;
            }

            100% {
                background-position:
                    100% 50%;
            }
        }

        .card-content {
            position: relative;

            z-index: 2;
        }

        .card-icon {
            width: 44px;

            height: 44px;

            border-radius: 12px;

            display: grid;

            place-items: center;

            background: #101218;

            border:
                1px solid #343946;

            font-size: 20px;

            margin-bottom: 12px;
        }

        .card-title {
            font-size: 17px;

            font-weight: 900;

            margin-bottom: 5px;
        }

        .card-description {
            color: #9298a5;

            font-size: 12px;

            line-height: 1.5;

            min-height: 37px;

            margin-bottom: 14px;
        }

        .card-action {
            display: block;

            width: 100%;

            padding: 11px 12px;

            border-radius: 10px;

            text-align: center;

            text-decoration: none;

            border:
                1px solid #343946;

            background: #101218;

            color: white;

            font-weight: 800;

            font-size: 13px;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        .card-action:hover {
            background: #222631;

            border-color:
                #5865f2;

            transform:
                translateY(-1px);
        }

        .owner-action:hover {
            border-color:
                #ff5a00;

            box-shadow:
                0 0 18px
                rgba(255, 80, 0, 0.2);
        }

        .settings-action:hover {
            border-color:
                #5865f2;

            box-shadow:
                0 0 18px
                rgba(88, 101, 242, 0.2);
        }

        /* =====================================================
           SETTINGS MODAL
        ===================================================== */

        .settings-overlay {
            display: none;

            position: fixed;

            inset: 0;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.72);

            backdrop-filter:
                blur(9px);

            z-index: 500;
        }

        .settings-overlay.active {
            display: flex;
        }

        .settings-modal {
            width: min(
                520px,
                100%
            );

            background:
                #181b24;

            border:
                1px solid #292e3a;

            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.5);
        }

        .settings-header {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 18px;
        }

        .settings-header h2 {
            margin: 0;

            font-size: 21px;
        }

        .close-settings {
            width: 35px;

            height: 35px;

            border: none;

            border-radius: 9px;

            background: #101218;

            color: #a8adba;

            cursor: pointer;
        }

        .close-settings:hover {
            color: white;

            background: #222631;
        }

        .setting-box {
            padding: 15px;

            border:
                1px solid #292e3a;

            border-radius: 12px;

            background:
                #101218;

            margin-bottom: 10px;
        }

        .setting-box strong {
            display: block;

            font-size: 13px;
        }

        .setting-box span {
            display: block;

            color: #9298a5;

            font-size: 12px;

            margin-top: 4px;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1100px) {

            .cards {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }

        @media (max-width: 760px) {

            .navbar {
                padding: 0 18px;
            }

            .user-name {
                display: none;
            }

            .cards {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 18px;
            }

            .dashboard-title {
                font-size: 29px;
            }

            .user-dropdown {
                right: -8px;

                width:
                    min(
                        330px,
                        calc(100vw - 28px)
                    );
            }

        }

        @media (max-width: 500px) {

            .content {
                padding:
                    40px 20px 60px;
            }

            .cards {
                grid-template-columns:
                    1fr;
            }

            .dashboard-title {
                font-size: 25px;
            }

            .dashboard-subtitle {
                font-size: 13px;
            }

            .user-area {
                gap: 6px;
            }

            .logout {
                padding:
                    8px 11px;
            }

        }

    </style>
</head>
