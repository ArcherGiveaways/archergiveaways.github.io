<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home - Archer Giveaways</title>

    <link rel="icon" href="../favicon.ico">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1117;

            color: white;

        }


        /* ================================
           NAVBAR
        ================================= */

        .navbar {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            background: #181b24;

            border-bottom:
                1px solid #292e3a;

        }


        /* ================================
           ARCHER GIVEAWAYS
        ================================= */

        .brand {

            font-size: 20px;

            font-weight: bold;

            color: white;

            text-decoration: none;

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

        }


        .brand:hover {

            opacity: 0.8;

            transform: translateY(-1px);

        }


        /* ================================
           USER AREA
        ================================= */

        .user-area {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .user-image {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid #3b82f6;

        }


        .user-name {

            font-size: 14px;

        }


        /* ================================
           LOGOUT
        ================================= */

        .logout {

            margin-left: 10px;

            padding:
                9px 15px;

            border: none;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .logout:hover {

            background: #dc2626;

            transform:
                translateY(-1px);

        }


        /* ================================
           MAIN CONTENT
        ================================= */

        .content {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                50px 30px;

        }


        /* ================================
           FIVE CARDS
        ================================= */

        .cards {

            width: 100%;

            max-width: 1250px;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 20px;

        }


        /* ================================
           CARD
        ================================= */

        .card {

            width: 100%;

            aspect-ratio: 4 / 6;

            position: relative;

            background: #181b24;

            border:
                1px solid #292e3a;

            border-radius: 16px;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            overflow: visible;

        }


        /* ================================
           FIRE RING
        ================================= */

        .card::before {

            content: "";

            position: absolute;

            inset: -3px;

            border-radius: 19px;

            background:
                conic-gradient(
                    from 0deg,
                    transparent 0deg,
                    transparent 35deg,
                    #ff1e00 70deg,
                    #ff5e00 100deg,
                    #ffb300 130deg,
                    transparent 165deg,
                    transparent 360deg
                );

            z-index: -1;

            opacity: 0;

            filter:
                blur(2px)
                drop-shadow(
                    0 0 6px #ff3c00
                );

            transition:
                opacity 0.25s ease;

        }


        /* ================================
           FIRE GLOW
        ================================= */

        .card::after {

            content: "";

            position: absolute;

            inset: -8px;

            border-radius: 23px;

            background:
                conic-gradient(
                    from 0deg,
                    transparent,
                    #ff2200,
                    #ff7a00,
                    transparent 35%,
                    transparent
                );

            z-index: -2;

            opacity: 0;

            filter:
                blur(12px);

            transition:
                opacity 0.25s ease;

        }


        /* ================================
           CARD HOVER
        ================================= */

        .card:hover {

            transform:
                translateY(-7px);

            box-shadow:
                0 15px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

        }


        .card:hover::before {

            opacity: 1;

            animation:
                fireRing
                1.4s
                linear
                infinite;

        }


        .card:hover::after {

            opacity: 0.65;

            animation:
                fireRing
                1.4s
                linear
                infinite;

        }


        /* ================================
           FIRE ANIMATION
        ================================= */

        @keyframes fireRing {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 1100px) {

            .cards {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .navbar {

                padding:
                    0 18px;

            }


            .user-name {

                display: none;

            }


            .logout {

                margin-left: 0;

            }


            .cards {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 450px) {

            .cards {

                grid-template-columns:
                    1fr;

            }


            .card {

                aspect-ratio:
                    4 / 6;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">


        <!--
            CLICKING ARCHER GIVEAWAYS
            OPENS THE DISCORD SERVER
        -->

        <a
            class="brand"
            href="https://discord.gg/jBFAzkdfWG"
            target="_blank"
            rel="noopener noreferrer"
        >
            Archer Giveaways
        </a>


        <div class="user-area">


            <img
                id="userImage"
                class="user-image"
                src=""
                alt="Profile"
            >


            <span
                id="userName"
                class="user-name"
            >
                Loading...
            </span>


            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>


        </div>

    </nav>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="content">


        <div class="cards">


            <!-- =================================
                 WEBSITE CARD 1
            ================================== -->

            <div class="card"></div>


            <!-- =================================
                 WEBSITE CARD 2
            ================================== -->

            <div class="card"></div>


            <!-- =================================
                 WEBSITE CARD 3
            ================================== -->

            <div class="card"></div>


            <!-- =================================
                 WEBSITE CARD 4
            ================================== -->

            <div class="card"></div>


            <!-- =================================
                 WEBSITE CARD 5
            ================================== -->

            <div class="card"></div>


        </div>

    </main>



<script>


    // =====================================================
    // CHECK LOGIN
    // =====================================================

    const loggedIn =
        localStorage.getItem(
            "archer_google_logged_in"
        );


    if (loggedIn !== "true") {

        window.location.replace(
            "../login/"
        );

    }



    // =====================================================
    // GET SAVED GOOGLE USER
    // =====================================================

    let user = null;


    try {

        const savedUser =
            localStorage.getItem(
                "archer_google_user"
            );


        if (savedUser) {

            user =
                JSON.parse(
                    savedUser
                );

        }

    } catch (error) {

        console.error(
            "Could not load Google user:",
            error
        );

    }



    // =====================================================
    // DISPLAY USER
    // =====================================================

    if (user) {


        const name =
            user.name ||
            user.given_name ||
            "User";


        document.getElementById(
            "userName"
        ).textContent =
            name;


        if (user.picture) {

            document.getElementById(
                "userImage"
            ).src =
                user.picture;

        } else {

            document.getElementById(
                "userImage"
            ).style.display =
                "none";

        }

    }



    // =====================================================
    // LOGOUT
    // =====================================================

    function logout() {


        localStorage.removeItem(
            "archer_google_logged_in"
        );


        localStorage.removeItem(
            "archer_google_credential"
        );


        localStorage.removeItem(
            "archer_google_user"
        );


        if (
            window.google &&
            google.accounts &&
            google.accounts.id
        ) {

            google.accounts.id
                .disableAutoSelect();

        }


        window.location.replace(
            "../login/"
        );

    }

</script>


</body>
</html>
