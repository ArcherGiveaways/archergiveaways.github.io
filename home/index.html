```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home - Archer Giveaways</title>

    <link rel="icon" href="../favicon.ico">


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1117;

            color: white;
        }


        /* =================================
           NAVBAR
        ================================= */

        .navbar {
            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            background: #181b24;

            border-bottom:
                1px solid #292e3a;
        }


        /* =================================
           BRAND
        ================================= */

        .brand {
            font-size: 20px;

            font-weight: bold;

            color: white;

            text-decoration: none;

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .brand:hover {
            opacity: 0.85;

            transform:
                translateY(-1px);
        }


        /* =================================
           USER AREA
        ================================= */

        .user-area {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .user-image {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid #3b82f6;
        }


        .user-name {
            font-size: 14px;
        }


        /* =================================
           LOGOUT
        ================================= */

        .logout {
            margin-left: 10px;

            padding:
                9px 15px;

            border: none;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .logout:hover {
            background: #dc2626;

            transform:
                translateY(-1px);
        }


        /* =================================
           MAIN
        ================================= */

        .content {
            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                50px 30px;
        }


        .dashboard {
            width: 100%;

            max-width: 1250px;
        }


        /* =================================
           HEADING
        ================================= */

        .dashboard-title {
            margin: 0 0 28px;

            text-align: center;

            font-size: 32px;

            font-weight: 900;

            letter-spacing: -0.5px;

            color: #ffffff;
        }


        /* =================================
           CARDS
        ================================= */

        .cards {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 22px;
        }


        /* =================================
           CARD
        ================================= */

        .card {
            position: relative;

            width: 100%;

            aspect-ratio:
                4 / 6;

            background: #181b24;

            border:
                1px solid #292e3a;

            border-radius: 16px;

            isolation: isolate;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            overflow: visible;
        }


        /* =================================
           LAVA OUTER GLOW
        ================================= */

        .card::before {
            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ff1600 0%,
                    #ff4d00 18%,
                    #ff9d00 35%,
                    #ff3100 52%,
                    #ff0800 70%,
                    #ff7800 86%,
                    #ff1a00 100%
                );

            padding: 4px;

            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite: xor;

            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;

            opacity: 0;

            pointer-events: none;

            z-index: -1;

            filter:
                drop-shadow(0 0 4px #ff3b00)
                drop-shadow(0 0 10px #ff1800)
                drop-shadow(0 0 18px #ff5a00);

            transition:
                opacity 0.25s ease;
        }


        /* =================================
           LAVA FLOW
        ================================= */

        .card::after {
            content: "";

            position: absolute;

            inset: -6px;

            border-radius: 22px;

            background:
                linear-gradient(
                    100deg,
                    transparent 0%,
                    transparent 15%,
                    #ff2100 25%,
                    #ff6500 32%,
                    #ffb300 38%,
                    #ff3b00 45%,
                    transparent 55%,
                    transparent 72%,
                    #ff1800 82%,
                    #ff7a00 91%,
                    transparent 100%
                );

            background-size:
                300% 100%;

            padding: 6px;

            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite: xor;

            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;

            opacity: 0;

            pointer-events: none;

            z-index: -2;

            filter:
                blur(7px);

            transition:
                opacity 0.25s ease;
        }


        /* =================================
           HOVER
        ================================= */

        .card:hover {
            transform:
                translateY(-8px);

            box-shadow:
                0 18px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );
        }


        .card:hover::before {
            opacity: 1;
        }


        .card:hover::after {
            opacity: 0.8;

            animation:
                lavaFlow
                2.2s
                ease-in-out
                infinite;
        }


        @keyframes lavaFlow {

            0% {
                background-position:
                    100% 50%;
            }

            50% {
                background-position:
                    0% 50%;
            }

            100% {
                background-position:
                    100% 50%;
            }

        }


        /* =================================
           TABLET
        ================================= */

        @media (max-width: 1100px) {

            .cards {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .navbar {
                padding:
                    0 18px;
            }


            .user-name {
                display: none;
            }


            .logout {
                margin-left: 0;
            }


            .cards {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 18px;
            }


            .dashboard-title {
                font-size: 26px;
            }

        }


        @media (max-width: 450px) {

            .content {
                padding:
                    30px 20px;
            }


            .cards {
                grid-template-columns:
                    1fr;
            }


            .dashboard-title {
                font-size: 23px;
            }


            .card {
                aspect-ratio:
                    4 / 6;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         NAVBAR
    ================================= -->

    <nav class="navbar">


        <a
            class="brand"
            href="https://discord.gg/jBFAzkdfWG"
            target="_blank"
            rel="noopener noreferrer"
        >
            Archer Giveaways
        </a>


        <div class="user-area">

            <img
                id="userImage"
                class="user-image"
                src=""
                alt="Profile"
            >


            <span
                id="userName"
                class="user-name"
            >
                Loading...
            </span>


            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- =================================
         MAIN DASHBOARD
    ================================= -->

    <main class="content">

        <div class="dashboard">


            <!-- TITLE ABOVE THE CARDS -->

            <h1 class="dashboard-title">
                Pick what you want to acces/do
            </h1>


            <!-- FIVE EMPTY CARDS -->

            <div class="cards">

                <div class="card"></div>

                <div class="card"></div>

                <div class="card"></div>

                <div class="card"></div>

                <div class="card"></div>

            </div>

        </div>

    </main>



<script>


    // =============================================
    // CHECK LOGIN
    // =============================================

    const loggedIn =
        localStorage.getItem(
            "archer_google_logged_in"
        );


    if (loggedIn !== "true") {

        window.location.replace(
            "../login/"
        );

    }



    // =============================================
    // LOAD SAVED GOOGLE USER
    // =============================================

    let user = null;


    try {

        const savedUser =
            localStorage.getItem(
                "archer_google_user"
            );


        if (savedUser) {

            user =
                JSON.parse(
                    savedUser
                );

        }

    } catch (error) {

        console.error(
            "Could not load Google user:",
            error
        );

    }



    // =============================================
    // DISPLAY USER
    // =============================================

    if (user) {

        const name =
            user.name ||
            user.given_name ||
            "User";


        document.getElementById(
            "userName"
        ).textContent =
            name;


        if (user.picture) {

            document.getElementById(
                "userImage"
            ).src =
                user.picture;

        } else {

            document.getElementById(
                "userImage"
            ).style.display =
                "none";

        }

    }



    // =============================================
    // LOGOUT
    // =============================================

    function logout() {

        localStorage.removeItem(
            "archer_google_logged_in"
        );


        localStorage.removeItem(
            "archer_google_credential"
        );


        localStorage.removeItem(
            "archer_google_user"
        );


        if (
            window.google &&
            google.accounts &&
            google.accounts.id
        ) {

            google.accounts.id
                .disableAutoSelect();

        }


        window.location.replace(
            "../login/"
        );

    }

</script>


</body>
</html>
```
