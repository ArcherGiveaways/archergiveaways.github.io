```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home - Archer Giveaways</title>

    <link rel="icon" href="../favicon.ico">


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1117;
            color: white;
        }


        /* ================================
           NAVBAR
        ================================= */

        .navbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: #181b24;

            border-bottom:
                1px solid #292e3a;
        }


        /* ================================
           BRAND
        ================================= */

        .brand {
            position: relative;

            font-size: 20px;
            font-weight: bold;

            color: white;

            text-decoration: none;

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .brand:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }


        /* ================================
           USER AREA
        ================================= */

        .user-area {
            display: flex;
            align-items: center;

            gap: 12px;
        }


        .user-image {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid #3b82f6;
        }


        .user-name {
            font-size: 14px;
        }


        /* ================================
           LOGOUT
        ================================= */

        .logout {
            margin-left: 10px;

            padding:
                9px 15px;

            border: none;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .logout:hover {
            background: #dc2626;

            transform:
                translateY(-1px);
        }


        /* ================================
           MAIN CONTENT
        ================================= */

        .content {
            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                50px 30px;
        }


        /* ================================
           CARDS CONTAINER
        ================================= */

        .cards {
            width: 100%;

            max-width: 1250px;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 22px;

            align-items: center;
        }


        /* ================================
           CARD
        ================================= */

        .card {
            position: relative;

            width: 100%;

            aspect-ratio: 4 / 6;

            background: #181b24;

            border:
                1px solid #292e3a;

            border-radius: 16px;

            overflow: visible;

            isolation: isolate;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        /*
            Inner layer.
            This keeps the center completely clean
            while the fire stays around the outside.
        */

        .card::before {
            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 20px;

            background:
                conic-gradient(
                    from 0deg,

                    transparent 0deg,
                    transparent 20deg,

                    #ff0000 45deg,
                    #ff3b00 70deg,
                    #ff7a00 95deg,
                    #ffb300 115deg,
                    #ff5a00 135deg,
                    #ff1200 160deg,

                    transparent 190deg,

                    transparent 360deg
                );

            /*
                Cut out the center so only
                the ring remains.
            */

            padding: 4px;

            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite: xor;

            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;

            opacity: 0;

            pointer-events: none;

            z-index: -1;

            filter:
                drop-shadow(
                    0 0 4px #ff3b00
                )
                drop-shadow(
                    0 0 9px #ff1800
                );

            transition:
                opacity 0.25s ease;
        }


        /*
            Larger blurred glow behind
            the main fire ring.
        */

        .card::after {
            content: "";

            position: absolute;

            inset: -10px;

            border-radius: 26px;

            background:
                conic-gradient(
                    from 0deg,

                    transparent 0deg,
                    transparent 25deg,

                    #ff1a00 55deg,
                    #ff5400 85deg,
                    #ff9d00 110deg,
                    #ff3c00 140deg,
                    #ff0900 165deg,

                    transparent 205deg,

                    transparent 360deg
                );

            padding: 10px;

            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite: xor;

            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;

            opacity: 0;

            pointer-events: none;

            z-index: -2;

            filter:
                blur(7px);

            transition:
                opacity 0.25s ease;
        }


        /* ================================
           CARD HOVER
        ================================= */

        .card:hover {
            transform:
                translateY(-8px)
                scale(1.015);

            box-shadow:
                0 18px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );
        }


        .card:hover::before {
            opacity: 1;

            animation:
                fireRing
                1.15s
                linear
                infinite;
        }


        .card:hover::after {
            opacity: 0.75;

            animation:
                fireRing
                1.15s
                linear
                infinite;
        }


        /* ================================
           FIRE ANIMATION
        ================================= */

        @keyframes fireRing {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 1100px) {

            .cards {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .navbar {
                padding:
                    0 18px;
            }


            .user-name {
                display: none;
            }


            .logout {
                margin-left: 0;
            }


            .cards {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 18px;
            }

        }


        @media (max-width: 450px) {

            .content {
                padding:
                    30px 20px;
            }


            .cards {
                grid-template-columns:
                    1fr;
            }


            .card {
                aspect-ratio:
                    4 / 6;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">


        <!--
            Archer Giveaways
            Clicking opens Discord
        -->

        <a
            class="brand"
            href="https://discord.gg/jBFAzkdfWG"
            target="_blank"
            rel="noopener noreferrer"
        >
            Archer Giveaways
        </a>


        <!-- USER AREA -->

        <div class="user-area">


            <img
                id="userImage"
                class="user-image"
                src=""
                alt="Profile"
            >


            <span
                id="userName"
                class="user-name"
            >
                Loading...
            </span>


            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>


        </div>

    </nav>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="content">


        <div class="cards">


            <!-- CARD 1 -->

            <div class="card"></div>


            <!-- CARD 2 -->

            <div class="card"></div>


            <!-- CARD 3 -->

            <div class="card"></div>


            <!-- CARD 4 -->

            <div class="card"></div>


            <!-- CARD 5 -->

            <div class="card"></div>


        </div>

    </main>



<script>


    // =====================================================
    // CHECK LOGIN
    // =====================================================

    const loggedIn =
        localStorage.getItem(
            "archer_google_logged_in"
        );


    if (loggedIn !== "true") {

        window.location.replace(
            "../login/"
        );

    }



    // =====================================================
    // GET SAVED GOOGLE USER
    // =====================================================

    let user = null;


    try {

        const savedUser =
            localStorage.getItem(
                "archer_google_user"
            );


        if (savedUser) {

            user =
                JSON.parse(
                    savedUser
                );

        }

    } catch (error) {

        console.error(
            "Could not load Google user:",
            error
        );

    }



    // =====================================================
    // DISPLAY USER
    // =====================================================

    if (user) {

        const name =
            user.name ||
            user.given_name ||
            "User";


        document.getElementById(
            "userName"
        ).textContent =
            name;


        if (user.picture) {

            document.getElementById(
                "userImage"
            ).src =
                user.picture;

        } else {

            document.getElementById(
                "userImage"
            ).style.display =
                "none";

        }

    }



    // =====================================================
    // LOGOUT
    // =====================================================

    function logout() {

        localStorage.removeItem(
            "archer_google_logged_in"
        );


        localStorage.removeItem(
            "archer_google_credential"
        );


        localStorage.removeItem(
            "archer_google_user"
        );


        if (
            window.google &&
            google.accounts &&
            google.accounts.id
        ) {

            google.accounts.id
                .disableAutoSelect();

        }


        window.location.replace(
            "../login/"
        );

    }

</script>


</body>
</html>
```
