<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home - Archer Giveaways</title>

    <link rel="icon" href="../favicon.ico">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1117;

            color: white;

        }


        /* ================================
           NAVBAR
        ================================= */

        .navbar {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            background: #181b24;

            border-bottom:
                1px solid #292e3a;

        }


        .brand {

            font-size: 20px;

            font-weight: bold;

        }


        .user-area {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .user-image {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid #3b82f6;

        }


        .user-name {

            font-size: 14px;

        }


        .logout {

            margin-left: 10px;

            padding:
                9px 15px;

            border: none;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        .logout:hover {

            background: #dc2626;

        }


        /* ================================
           MAIN
        ================================= */

        .content {

            max-width: 1100px;

            margin: auto;

            padding:
                50px 25px;

        }


        .welcome {

            margin-bottom: 30px;

        }


        .welcome h1 {

            margin: 0 0 10px;

            font-size: 36px;

        }


        .welcome p {

            margin: 0;

            color: #9ca3af;

        }


        .card {

            padding: 30px;

            background: #181b24;

            border:
                1px solid #292e3a;

            border-radius: 16px;

        }


        .card h2 {

            margin-top: 0;

        }


        .email {

            color: #9ca3af;

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">

        <div class="brand">
            Archer Giveaways
        </div>


        <div class="user-area">

            <img
                id="userImage"
                class="user-image"
                src=""
                alt="Profile"
            >


            <span
                id="userName"
                class="user-name"
            >
                Loading...
            </span>


            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="content">

        <section class="welcome">

            <h1>
                Welcome,
                <span id="welcomeName">
                    User
                </span>!
            </h1>


            <p>
                Welcome to Archer Giveaways.
            </p>

        </section>



        <section class="card">

            <h2>
                Your Account
            </h2>


            <p>
                Google account:
            </p>


            <p
                id="userEmail"
                class="email"
            >
                Loading...
            </p>

        </section>

    </main>



<script>

    // =====================================================
    // CHECK LOGIN
    // =====================================================

    const loggedIn =
        localStorage.getItem(
            "archer_google_logged_in"
        );


    if (loggedIn !== "true") {

        window.location.replace(
            "../login/"
        );

    }



    // =====================================================
    // GET SAVED GOOGLE USER
    // =====================================================

    let user = null;


    try {

        const savedUser =
            localStorage.getItem(
                "archer_google_user"
            );


        if (savedUser) {

            user = JSON.parse(
                savedUser
            );

        }

    } catch (error) {

        console.error(
            "Could not load Google user:",
            error
        );

    }



    // =====================================================
    // DISPLAY USER
    // =====================================================

    if (user) {

        const name =
            user.name ||
            user.given_name ||
            "User";


        const email =
            user.email ||
            "Unknown";


        document.getElementById(
            "userName"
        ).textContent = name;


        document.getElementById(
            "welcomeName"
        ).textContent = name;


        document.getElementById(
            "userEmail"
        ).textContent = email;


        if (user.picture) {

            document.getElementById(
                "userImage"
            ).src = user.picture;

        } else {

            document.getElementById(
                "userImage"
            ).style.display = "none";

        }

    }



    // =====================================================
    // LOGOUT
    // =====================================================

    function logout() {

        localStorage.removeItem(
            "archer_google_logged_in"
        );

        localStorage.removeItem(
            "archer_google_credential"
        );

        localStorage.removeItem(
            "archer_google_user"
        );


        if (
            window.google &&
            google.accounts &&
            google.accounts.id
        ) {

            google.accounts.id.disableAutoSelect();

        }


        window.location.replace(
            "../login/"
        );

    }

</script>


</body>
</html>
