<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home - Archer Giveaways</title>

    <link rel="icon" href="../favicon.ico">

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f1117;

            color: white;

        }


        /* ================================
           NAVBAR
        ================================= */

        .navbar {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            background: #181b24;

            border-bottom:
                1px solid #292e3a;

        }


        /* ================================
           ARCHER GIVEAWAYS BRAND
        ================================= */

        .brand {

            font-size: 20px;

            font-weight: bold;

            color: white;

            text-decoration: none;

            cursor: pointer;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

        }


        .brand:hover {

            opacity: 0.8;

            transform: translateY(-1px);

        }


        /* ================================
           USER AREA
        ================================= */

        .user-area {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .user-image {

            width: 38px;

            height: 38px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid #3b82f6;

        }


        .user-name {

            font-size: 14px;

        }


        .logout {

            margin-left: 10px;

            padding:
                9px 15px;

            border: none;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;

        }


        .logout:hover {

            background: #dc2626;

            transform: translateY(-1px);

        }


        /* ================================
           MAIN
        ================================= */

        .content {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 25px;

        }


        /* ================================
           FIVE WEBSITE CARDS
        ================================= */

        .cards {

            width: 100%;

            max-width: 1250px;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 20px;

        }


        .card {

            height: 260px;

            background: #181b24;

            border:
                1px solid #292e3a;

            border-radius: 16px;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        .card:hover {

            transform: translateY(-5px);

            border-color: #3b82f6;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);

        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 1100px) {

            .cards {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        @media (max-width: 700px) {

            .navbar {

                padding: 0 18px;

            }


            .user-name {

                display: none;

            }


            .logout {

                margin-left: 0;

            }


            .cards {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 450px) {

            .cards {

                grid-template-columns:
                    1fr;

            }


            .card {

                height: 200px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">


        <!-- CLICKING THIS OPENS DISCORD -->

        <a
            class="brand"
            href="https://discord.gg/jBFAzkdfWG"
            target="_blank"
            rel="noopener noreferrer"
        >
            Archer Giveaways
        </a>


        <div class="user-area">

            <img
                id="userImage"
                class="user-image"
                src=""
                alt="Profile"
            >


            <span
                id="userName"
                class="user-name"
            >
                Loading...
            </span>


            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </nav>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="content">

        <div class="cards">


            <!-- WEBSITE CARD 1 -->

            <div class="card"></div>


            <!-- WEBSITE CARD 2 -->

            <div class="card"></div>


            <!-- WEBSITE CARD 3 -->

            <div class="card"></div>


            <!-- WEBSITE CARD 4 -->

            <div class="card"></div>


            <!-- WEBSITE CARD 5 -->

            <div class="card"></div>


        </div>

    </main>



<script>

    // =====================================================
    // CHECK LOGIN
    // =====================================================

    const loggedIn =
        localStorage.getItem(
            "archer_google_logged_in"
        );


    if (loggedIn !== "true") {

        window.location.replace(
            "../login/"
        );

    }



    // =====================================================
    // GET SAVED GOOGLE USER
    // =====================================================

    let user = null;


    try {

        const savedUser =
            localStorage.getItem(
                "archer_google_user"
            );


        if (savedUser) {

            user = JSON.parse(
                savedUser
            );

        }

    } catch (error) {

        console.error(
            "Could not load Google user:",
            error
        );

    }



    // =====================================================
    // DISPLAY USER
    // =====================================================

    if (user) {

        const name =
            user.name ||
            user.given_name ||
            "User";


        document.getElementById(
            "userName"
        ).textContent = name;


        if (user.picture) {

            document.getElementById(
                "userImage"
            ).src = user.picture;

        } else {

            document.getElementById(
                "userImage"
            ).style.display = "none";

        }

    }



    // =====================================================
    // LOGOUT
    // =====================================================

    function logout() {

        localStorage.removeItem(
            "archer_google_logged_in"
        );

        localStorage.removeItem(
            "archer_google_credential"
        );

        localStorage.removeItem(
            "archer_google_user"
        );


        if (
            window.google &&
            google.accounts &&
            google.accounts.id
        ) {

            google.accounts.id.disableAutoSelect();

        }


        window.location.replace(
            "../login/"
        );

    }

</script>


</body>
</html>
