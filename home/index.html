<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home - Archer Giveaways</title>

    <link rel="icon" href="../favicon.ico">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1117;
            color: white;
        }

        .navbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: #181b24;
            border-bottom: 1px solid #292e3a;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-profile-box {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            background: #101218;
            border: 1px solid #292e3a;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }

        .user-profile-box:hover {
            background: #1f2330;
            border-color: #3b82f6;
        }

        .user-image {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #3b82f6;
        }

        .user-name {
            font-size: 14px;
        }

        .user-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 280px;
            background: #181b24;
            border: 1px solid #292e3a;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 100;
            padding: 15px;
        }

        .user-dropdown.active {
            display: block;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .profile-header img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-header strong {
            display: block;
            font-size: 15px;
        }

        .profile-header span {
            color: #888;
            font-size: 12px;
        }

        .discord-section {
            padding-top: 13px;
            border-top: 1px solid #292e3a;
        }

        .discord-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .discord-status {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }

        .verify-button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 10px;
            background: #5865f2;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .verify-button:hover {
            background: #4752c4;
        }

        .verify-form {
            display: none;
            margin-top: 12px;
        }

        .verify-form.active {
            display: block;
        }

        .verify-input {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #343946;
            background: #101218;
            color: white;
            outline: none;
            text-align: center;
            letter-spacing: 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .verify-input:focus {
            border-color: #5865f2;
        }

        .verify-submit {
            width: 100%;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            padding: 10px;
            background: #22c55e;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .verify-submit:hover {
            background: #16a34a;
        }

        .verify-message {
            min-height: 18px;
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
        }

        .verify-success {
            color: #6cff9b;
        }

        .verify-error {
            color: #ff6b6b;
        }

        .logout {
            margin-left: 10px;
            padding: 9px 15px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .logout:hover {
            background: #dc2626;
        }

        .content {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 30px;
        }

        .dashboard {
            width: 100%;
            max-width: 1250px;
        }

        .dashboard-title {
            margin: 0 0 28px;
            text-align: center;
            font-size: 32px;
            font-weight: 900;
        }

        .cards {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 22px;
        }

        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 6;
            background: #181b24;
            border: 1px solid #292e3a;
            border-radius: 16px;
            isolation: isolate;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                #ff1600 0%,
                #ff4d00 18%,
                #ff9d00 35%,
                #ff3100 52%,
                #ff0800 70%,
                #ff7800 86%,
                #ff1a00 100%
            );
            padding: 4px;
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask-composite: exclude;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            filter:
                drop-shadow(0 0 4px #ff3b00)
                drop-shadow(0 0 10px #ff1800)
                drop-shadow(0 0 18px #ff5a00);
        }

        .card::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 22px;
            background: linear-gradient(
                100deg,
                transparent 0%,
                transparent 15%,
                #ff2100 25%,
                #ff6500 32%,
                #ffb300 38%,
                #ff3b00 45%,
                transparent 55%,
                transparent 72%,
                #ff1800 82%,
                #ff7a00 91%,
                transparent 100%
            );
            background-size: 300% 100%;
            padding: 6px;
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask-composite: exclude;
            opacity: 0;
            pointer-events: none;
            z-index: -2;
            filter: blur(7px);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover::after {
            opacity: 0.8;
            animation: lavaFlow 2.2s ease-in-out infinite;
        }

        @keyframes lavaFlow {
            0% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        @media (max-width: 1100px) {
            .cards {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 0 18px;
            }

            .user-name {
                display: none;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }

            .dashboard-title {
                font-size: 26px;
            }
        }

        @media (max-width: 450px) {
            .content {
                padding: 30px 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .dashboard-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <a
        class="brand"
        href="https://discord.gg/jBFAzkdfWG"
        target="_blank"
        rel="noopener noreferrer"
    >
        Archer Giveaways
    </a>

    <div class="user-area">

        <div
            class="user-profile-box"
            id="userProfileBtn"
        >

            <img
                id="userImage"
                class="user-image"
                src=""
                alt="Profile"
            >

            <span
                id="userName"
                class="user-name"
            >
                Loading...
            </span>

            <div
                class="user-dropdown"
                id="userDropdown"
            >

                <div class="profile-header">

                    <img
                        id="dropdownUserImage"
                        src=""
                        alt="Discord / Google profile"
                    >

                    <div>
                        <strong id="dropdownUserName">
                            User
                        </strong>

                        <span id="dropdownUserEmail">
                            —
                        </span>
                    </div>

                </div>

                <div class="discord-section">

                    <div class="discord-title">
                        Discord
                    </div>

                    <div
                        class="discord-status"
                        id="discordStatus"
                    >
                        Not verified
                    </div>

                    <button
                        class="verify-button"
                        id="verifyButton"
                        onclick="openVerifyForm(event)"
                    >
                        Verify Discord
                    </button>

                    <div
                        class="verify-form"
                        id="verifyForm"
                    >

                        <input
                            id="verifyCode"
                            class="verify-input"
                            type="text"
                            maxlength="6"
                            placeholder="6-CHAR CODE"
                            autocomplete="off"
                            spellcheck="false"
                        >

                        <button
                            class="verify-submit"
                            id="verifySubmit"
                            onclick="submitDiscordVerification(event)"
                        >
                            Verify Discord
                        </button>

                        <div
                            class="verify-message"
                            id="verifyMessage"
                        ></div>

                    </div>

                </div>

            </div>

        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>
</nav>


<main class="content">

    <div class="dashboard">

        <h1 class="dashboard-title">
            Pick what you want to access/do
        </h1>

        <div class="cards">

            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>

        </div>

    </div>

</main>


<script>

const WORKER_URL =
    "https://archer.arcdepths.workers.dev";

let currentUser = null;


/* --------------------------------
   LOAD GOOGLE USER
-------------------------------- */

function renderUser() {

    const loggedIn =
        localStorage.getItem(
            "archer_google_logged_in"
        );

    if (loggedIn !== "true") {

        window.location.replace("../login/");
        return;
    }


    try {

        const savedUser =
            localStorage.getItem(
                "archer_google_user"
            );

        if (savedUser) {

            currentUser =
                JSON.parse(savedUser);

        }

    } catch (error) {

        console.error(
            "Could not load user:",
            error
        );

    }


    if (!currentUser) {
        return;
    }


    const name =
        currentUser.name ||
        currentUser.given_name ||
        "User";


    document.getElementById(
        "userName"
    ).textContent = name;


    document.getElementById(
        "dropdownUserName"
    ).textContent = name;


    document.getElementById(
        "dropdownUserEmail"
    ).textContent =
        currentUser.email || "";


    const picture =
        currentUser.picture;


    if (picture) {

        document.getElementById(
            "userImage"
        ).src = picture;

        document.getElementById(
            "dropdownUserImage"
        ).src = picture;

    }


    updateDiscordStatus();

}


/* --------------------------------
   DISCORD STATUS
-------------------------------- */

function updateDiscordStatus() {

    const verified =
        currentUser?.discordVerified === true;

    const status =
        document.getElementById(
            "discordStatus"
        );

    const button =
        document.getElementById(
            "verifyButton"
        );

    if (verified) {

        status.textContent =
            "Verified ✓";

        status.className =
            "discord-status verify-success";

        button.style.display =
            "none";

    } else {

        status.textContent =
            "Not verified";

        button.style.display =
            "block";

    }

}


/* --------------------------------
   OPEN VERIFY FORM
-------------------------------- */

function openVerifyForm(event) {

    if (event) {
        event.stopPropagation();
    }

    document
        .getElementById("verifyForm")
        .classList.add("active");

    document
        .getElementById("verifyCode")
        .focus();

}


/* --------------------------------
   VERIFY DISCORD
-------------------------------- */

async function submitDiscordVerification(event) {

    if (event) {
        event.stopPropagation();
    }

    const input =
        document.getElementById(
            "verifyCode"
        );

    const message =
        document.getElementById(
            "verifyMessage"
        );

    const submit =
        document.getElementById(
            "verifySubmit"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    message.className =
        "verify-message";

    message.textContent = "";


    if (!/^[A-Z0-9]{6}$/.test(code)) {

        message.className =
            "verify-message verify-error";

        message.textContent =
            "Enter the 6-character code.";

        return;
    }


    if (!currentUser?.sub) {

        message.className =
            "verify-message verify-error";

        message.textContent =
            "Your Google account could not be identified.";

        return;
    }


    submit.disabled = true;
    submit.textContent = "Checking...";


    try {

        const response =
            await fetch(
                `${WORKER_URL}/discord/verify`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            code: code,
                            googleId: currentUser.sub
                        })
                }
            );


        const data =
            await response.json();


        if (
            response.ok &&
            data.success === true
        ) {

            currentUser.discordVerified =
                true;

            currentUser.discordId =
                data.discordId;

            currentUser.discordName =
                data.discordName;

            currentUser.discordUsername =
                data.discordUsername;

            currentUser.picture =
                data.discordAvatar ||
                currentUser.picture;


            localStorage.setItem(
                "archer_google_user",
                JSON.stringify(
                    currentUser
                )
            );


            document.getElementById(
                "userImage"
            ).src =
                currentUser.picture;


            document.getElementById(
                "dropdownUserImage"
            ).src =
                currentUser.picture;


            updateDiscordStatus();


            message.className =
                "verify-message verify-success";

            message.textContent =
                "Discord verified ✓";


            input.value = "";

            return;
        }


        message.className =
            "verify-message verify-error";

        message.textContent =
            data.message ||
            "Invalid or expired code.";


    } catch (error) {

        console.error(
            "Discord verification error:",
            error
        );

        message.className =
            "verify-message verify-error";

        message.textContent =
            "Could not connect to Archer.";

    } finally {

        submit.disabled = false;
        submit.textContent =
            "Verify Discord";

    }

}


/* --------------------------------
   PROFILE DROPDOWN
-------------------------------- */

const userProfileBtn =
    document.getElementById(
        "userProfileBtn"
    );

const userDropdown =
    document.getElementById(
        "userDropdown"
    );


userProfileBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        userDropdown.classList.toggle(
            "active"
        );

    }
);


document.addEventListener(
    "click",
    function(event) {

        if (
            !userProfileBtn.contains(
                event.target
            )
        ) {

            userDropdown.classList.remove(
                "active"
            );

        }

    }
);


/* --------------------------------
   LOGOUT
-------------------------------- */

function logout() {

    localStorage.removeItem(
        "archer_google_logged_in"
    );

    localStorage.removeItem(
        "archer_google_credential"
    );

    localStorage.removeItem(
        "archer_google_user"
    );


    if (
        window.google &&
        google.accounts &&
        google.accounts.id
    ) {

        google.accounts.id
            .disableAutoSelect();

    }


    window.location.replace(
        "../login/"
    );

}


/* --------------------------------
   START
-------------------------------- */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        renderUser
    );

} else {

    renderUser();

}

</script>

</body>
</html>
