<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Archer Giveaways - Owner Dashboard
  </title>


  <style>

    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }


    body {
      font-family:
        system-ui,
        -apple-system,
        sans-serif;

      background:
        var(--bg);

      color:
        var(--text);

      margin: 0;

      padding: 24px;
    }


    .container {
      max-width: 1000px;
      margin: 0 auto;
    }


    h1,
    h2 {
      color:
        var(--text);

      margin-bottom: 16px;
    }


    .grid {
      display: grid;

      grid-template-columns:
        1fr;

      gap: 24px;
    }


    @media (min-width: 768px) {

      .grid {
        grid-template-columns:
          1fr 1fr;
      }

    }


    .card {
      background:
        var(--card);

      border-radius:
        12px;

      padding:
        20px;

      border:
        1px solid #334155;
    }


    .form-group {
      margin-bottom:
        12px;
    }


    label {
      display:
        block;

      font-size:
        0.875rem;

      color:
        var(--text-muted);

      margin-bottom:
        4px;
    }


    input,
    button {
      width:
        100%;

      padding:
        10px;

      border-radius:
        6px;

      border:
        1px solid #334155;

      background:
        #0f172a;

      color:
        var(--text);

      box-sizing:
        border-box;
    }


    button {
      background:
        var(--accent);

      font-weight:
        600;

      cursor:
        pointer;

      border:
        none;

      margin-top:
        8px;
    }


    button:hover {
      opacity:
        0.9;
    }


    button.danger {
      background:
        var(--danger);
    }


    #eventsList {
      margin-top:
        12px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>
      Owner Control Panel
    </h1>


    <div class="grid">


      <!-- CREATE EVENT -->

      <div class="card">

        <h2>
          Create Event
        </h2>


        <div class="form-group">

          <label>
            Event Type
          </label>

          <select
            id="eventType"
            style="
              width:100%;
              padding:10px;
              border-radius:6px;
              border:1px solid #334155;
              background:#0f172a;
              color:#f8fafc;
            "
          >

            <option value="giveaway">
              Giveaway
            </option>

            <option value="rain">
              Coin Rain
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Title
          </label>

          <input
            type="text"
            id="eventTitle"
            placeholder="e.g. 5M Coin Giveaway"
          >

        </div>


        <div class="form-group">

          <label>
            Description
          </label>

          <input
            type="text"
            id="eventDesc"
            placeholder="Event details"
          >

        </div>


        <div class="form-group">

          <label>
            Prize (Coins)
          </label>

          <input
            type="number"
            id="eventPrize"
            value="0"
            min="1"
            step="1"
            placeholder="e.g. 5000000"
          >

        </div>


        <div class="form-group">

          <label>
            Duration (minutes)
          </label>

          <input
            type="number"
            id="eventDuration"
            value="60"
            min="1"
            step="1"
          >

        </div>


        <button
          onclick="createEvent()"
        >
          Publish Event
        </button>

      </div>


      <!-- EVENT MANAGER -->

      <div class="card">

        <h2>
          Active Events
        </h2>


        <div id="eventsList">
          Loading...
        </div>


        <button
          class="danger"
          onclick="clearAllEvents()"
          style="margin-top:16px;"
        >
          Clear All Events
        </button>

      </div>


    </div>

  </div>


  <script>

    const WORKER_URL =
      "https://archer.arcdepths.workers.dev";


    function escapeHtml(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function formatNumber(
      value
    ) {

      return Number(
        value || 0
      ).toLocaleString(
        "en-US"
      );

    }


    function getTimeText(
      event
    ) {

      if (
        event.endsAt
      ) {

        const remaining =
          Math.max(
            0,
            Number(
              event.endsAt
            ) -
            Date.now()
          );


        if (
          remaining <= 0
        ) {

          return "Ended";

        }


        const seconds =
          Math.floor(
            remaining / 1000
          );


        const days =
          Math.floor(
            seconds / 86400
          );


        const hours =
          Math.floor(
            (
              seconds % 86400
            ) / 3600
          );


        const minutes =
          Math.floor(
            (
              seconds % 3600
            ) / 60
          );


        const secs =
          seconds % 60;


        if (days > 0) {
          return (
            `${days}d ${hours}h`
          );
        }


        if (hours > 0) {
          return (
            `${hours}h ${minutes}m`
          );
        }


        if (minutes > 0) {
          return (
            `${minutes}m ${secs}s`
          );
        }


        return (
          `${secs}s`
        );

      }


      return event.time || "";

    }


    async function loadEvents() {

      const listEl =
        document.getElementById(
          "eventsList"
        );


      try {

        const res =
          await fetch(
            `${WORKER_URL}/events`
          );


        const data =
          await res.json();


        if (
          !data.success ||
          !Array.isArray(
            data.events
          ) ||
          data.events.length === 0
        ) {

          listEl.innerHTML =
            "<p style='color:var(--text-muted)'>No active events.</p>";

          return;

        }


        listEl.innerHTML =
          data.events
            .map(
              (evt, index) => `

                <div
                  style="
                    border-bottom:1px solid #334155;
                    padding:10px 0;
                  "
                >

                  <strong>
                    ${escapeHtml(
                      evt.title
                    )}
                  </strong>

                  <br>

                  <small
                    style="color:var(--text-muted)"
                  >
                    ${
                      evt.type === "rain"
                        ? "Rain"
                        : "Giveaway"
                    }
                    ·
                    Prize:
                    ${formatNumber(
                      evt.prize
                    )}
                    coins
                  </small>

                  <br>

                  <small
                    style="color:var(--text-muted)"
                  >
                    ${escapeHtml(
                      getTimeText(evt)
                    )}
                  </small>

                  <button
                    class="danger"
                    style="
                      width:auto;
                      padding:6px 12px;
                      float:right;
                    "
                    onclick="removeEvent(${index})"
                  >
                    Delete
                  </button>

                </div>

              `
            )
            .join("");


      } catch (error) {

        console.error(
          error
        );


        listEl.innerHTML =
          "<p style='color:var(--danger)'>Failed to load events.</p>";

      }

    }


    async function createEvent() {

      const type =
        document.getElementById(
          "eventType"
        ).value;


      const title =
        document.getElementById(
          "eventTitle"
        ).value.trim();


      const description =
        document.getElementById(
          "eventDesc"
        ).value.trim();


      const prize =
        parseInt(
          document.getElementById(
            "eventPrize"
          ).value,
          10
        ) || 0;


      const duration =
        parseInt(
          document.getElementById(
            "eventDuration"
          ).value,
          10
        ) || 60;


      if (!title) {

        alert(
          "Please provide a title."
        );

        return;

      }


      if (prize <= 0) {

        alert(
          "Please provide a valid prize amount."
        );

        return;

      }


      try {

        const res =
          await fetch(
            `${WORKER_URL}/events`
          );


        if (!res.ok) {
          throw new Error(
            "Could not load events."
          );
        }


        const data =
          await res.json();


        const currentEvents =
          Array.isArray(
            data.events
          )
            ? data.events
            : [];


        const endsAt =
          Date.now() +
          (
            duration *
            60 *
            1000
          );


        const newEvent = {

          id:
            "evt_" +
            Date.now(),

          type,

          title,

          description,

          prize,

          endsAt,

          createdAt:
            Date.now()

        };


        currentEvents.push(
          newEvent
        );


        const saveResponse =
          await fetch(
            `${WORKER_URL}/admin/events`,
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  events:
                    currentEvents
                })

            }
          );


        const saveData =
          await saveResponse.json();


        if (
          !saveResponse.ok ||
          !saveData.success
        ) {

          throw new Error(
            saveData.error ||
            "Failed to save events."
          );

        }


        document.getElementById(
          "eventTitle"
        ).value = "";


        document.getElementById(
          "eventDesc"
        ).value = "";


        document.getElementById(
          "eventPrize"
        ).value = "0";


        await loadEvents();


      } catch (error) {

        console.error(
          "Create event error:",
          error
        );


        alert(
          error.message ||
          "Failed to create event."
        );

      }

    }


    async function removeEvent(
      index
    ) {

      try {

        const res =
          await fetch(
            `${WORKER_URL}/events`
          );


        const data =
          await res.json();


        let currentEvents =
          Array.isArray(
            data.events
          )
            ? data.events
            : [];


        currentEvents.splice(
          index,
          1
        );


        const saveResponse =
          await fetch(
            `${WORKER_URL}/admin/events`,
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  events:
                    currentEvents
                })

            }
          );


        const saveData =
          await saveResponse.json();


        if (
          !saveResponse.ok ||
          !saveData.success
        ) {

          throw new Error(
            saveData.error ||
            "Failed to update events."
          );

        }


        await loadEvents();


      } catch (error) {

        console.error(
          error
        );


        alert(
          "Failed to delete event."
        );

      }

    }


    async function clearAllEvents() {

      if (
        !confirm(
          "Are you sure you want to delete all active events?"
        )
      ) {

        return;

      }


      try {

        const response =
          await fetch(
            `${WORKER_URL}/admin/events`,
            {

              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  events: []
                })

            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Failed to clear events."
          );

        }


        await loadEvents();


      } catch (error) {

        console.error(
          error
        );


        alert(
          "Failed to clear events."
        );

      }

    }


    loadEvents();


    setInterval(
      loadEvents,
      1000
    );

  </script>

</body>

</html>
