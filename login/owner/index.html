<div class="container">


    <h1>
        Owner Login

        Sign in with Google to continue
    </p>


    <div class="google-section">

        <div id="googleButton"></div>

            class="status"

            Waiting for Google sign-in...
        </div>

        </span>

            id="password"
            type="password"
            placeholder="Owner password"
            disabled
            autocomplete="off"
        >

            id="loginButton"
            disabled
            type="button"
        >
            Unlock Owner Panel
        </button>

            id="message"
            class="message"
        ></div>

    </div>

        class="back"
        href="/login/"
    >
        ← Back to Login
    </a>

<script>


/* ============================================================
   CONFIG
============================================================ */

const GOOGLE_CLIENT_ID =
    "263646768191-7854avn92k94rq8pbit809o0erq48grq.apps.googleusercontent.com";


const WORKER_URL =
    "https://archer.arcdepths.workers.dev";


const OWNER_AUTH_KEY =
    "archer_owner_authenticated";


let googleCredential =
    null;


let googleUser =
    null;


/* ============================================================
   ELEMENTS
============================================================ */

const googleButton =
    document.getElementById(
        "googleButton"
    );


const googleStatus =
    document.getElementById(
        "googleStatus"
    );


const passwordSection =
    document.getElementById(
        "passwordSection"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


/*
 * Opening the owner-login page starts
 * a fresh owner authentication process.
 */

localStorage.removeItem(
    OWNER_AUTH_KEY
);


/* ============================================================
   GOOGLE LOGIN
============================================================ */

function handleGoogleLogin(
    response
) {

    if (
        !response ||
        !response.credential
    ) {

        googleStatus.textContent =
            "Google sign-in failed.";

        googleStatus.className =
            "status error";

        return;

    }


    googleCredential =
        response.credential;


    try {

        const parts =
            googleCredential.split(".");


        if (
            parts.length !== 3
        ) {

            throw new Error(
                "Invalid Google credential."
            );

        }


        googleUser =
            JSON.parse(

                atob(

                    parts[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/")

                )

            );


        /*
         * Store the Google session for
         * the owner home page.
         */

        localStorage.setItem(
            "archer_google_logged_in",
            "true"
        );


        localStorage.setItem(
            "archer_google_credential",
            googleCredential
        );


        localStorage.setItem(
            "archer_google_user",
            JSON.stringify(
                googleUser
            )
        );


        googleStatus.textContent =
            "Google account verified ✓";

        googleStatus.className =
            "status success";


        passwordSection.classList.add(
            "unlocked"
        );


        passwordInput.disabled =
            false;


        loginButton.disabled =
            false;


        passwordInput.focus();


    } catch (error) {

        console.error(
            "Google authentication error:",
            error
        );


        googleCredential =
            null;


        googleUser =
            null;


        googleStatus.textContent =
            "Could not verify Google account.";

        googleStatus.className =
            "status error";

    }

}


/* ============================================================
   GOOGLE INITIALIZATION
============================================================ */

function initializeGoogle() {

    if (
        !window.google ||
        !window.google.accounts ||
        !window.google.accounts.id
    ) {

        googleStatus.textContent =
            "Google Sign-In is still loading...";


        setTimeout(
            initializeGoogle,
            500
        );


        return;

    }


    google.accounts.id.initialize({

        client_id:
            GOOGLE_CLIENT_ID,

        callback:
            handleGoogleLogin,

        auto_select:
            false,

        cancel_on_tap_outside:
            false

    });


    google.accounts.id.renderButton(

        googleButton,

        {

            theme:
                "filled_black",

            size:
                "large",

            width:
                300,

            text:
                "signin_with",

            shape:
                "pill"

        }

    );

}


/* ============================================================
   OWNER PASSWORD
============================================================ */

async function submitOwnerLogin() {

    message.textContent =
        "";

    message.className =
        "message";


    if (
        !googleCredential ||
        !googleUser ||
        !googleUser.sub
    ) {

        message.textContent =
            "Please sign in with Google first.";

        message.className =
            "message error";

        return;

    }


    const password =
        passwordInput.value.trim();


    if (
        !password
    ) {

        message.textContent =
            "Enter the owner password.";

        message.className =
            "message error";

        passwordInput.focus();

        return;

    }


    loginButton.disabled =
        true;


    loginButton.textContent =
        "Checking...";


    try {

        /*
         * Owner Worker endpoint.
         *
         * The current Worker expects
         * the password here.
         */

        const response =
            await fetch(
                `${WORKER_URL}/owner`,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            password:
                                password

                        })

                }
            );


        let data;


        try {

            data =
                await response.json();

        } catch {

            data =
                null;

        }


        if (
            response.ok &&
            data &&
            data.success === true
        ) {

            /*
             * Google is already authenticated
             * and the Worker accepted the
             * owner password.
             */

            localStorage.setItem(
                OWNER_AUTH_KEY,
                "true"
            );


            message.textContent =
                "Owner access granted ✓";

            message.className =
                "message success";


            setTimeout(
                function () {

                    window.location.replace(
                        "/home/owner/"
                    );

                },
                400
            );


            return;

        }


        message.textContent =
            (
                data &&
                data.message
            ) ||
            "Incorrect owner password.";

        message.className =
            "message error";


        loginButton.disabled =
            false;


        loginButton.textContent =
            "Unlock Owner Panel";


    } catch (error) {

        console.error(
            "Owner authentication error:",
            error
        );


        message.textContent =
            "Could not connect to the owner authentication server.";

        message.className =
            "message error";


        loginButton.disabled =
            false;


        loginButton.textContent =
            "Unlock Owner Panel";

    }

}


/* ============================================================
   BUTTON
============================================================ */

loginButton.addEventListener(
    "click",
    submitOwnerLogin
);


/* ============================================================
   ENTER KEY
============================================================ */

passwordInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            !loginButton.disabled
        ) {

            submitOwnerLogin();

        }

    }
);


/* ============================================================
   START GOOGLE
============================================================ */

window.addEventListener(
    "load",
    initializeGoogle
);

</script>


</body>
