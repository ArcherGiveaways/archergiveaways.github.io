<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Login - Archer Giveaways</title>

    <link rel="icon" href="../../favicon.ico">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #202020 0%,
                    #0d0d0d 45%,
                    #050505 100%
                );

            color: white;
        }

        .container {
            width: calc(100% - 30px);
            max-width: 430px;

            padding: 35px;

            border-radius: 22px;

            background:
                rgba(20, 20, 20, 0.94);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.65);

            text-align: center;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 32px;
            font-weight: 800;
        }

        .subtitle {
            margin: 0 0 30px;

            color: #999;

            font-size: 15px;
        }

        .google-section {
            margin-bottom: 25px;
        }

        #googleButton {
            display: flex;
            justify-content: center;
        }

        .status {
            min-height: 22px;

            margin-top: 14px;

            font-size: 14px;

            color: #777;

            transition:
                color 0.2s ease;
        }

        .success {
            color: #6cff9b !important;
        }

        .error {
            color: #ff6b6b !important;
        }

        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255, 255, 255, 0.1);
        }

        .divider span {
            color: #666;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1px;
        }

        .password-section {
            opacity: 0.4;

            pointer-events: none;

            transition:
                opacity 0.25s ease;
        }

        .password-section.unlocked {
            opacity: 1;

            pointer-events: auto;
        }

        input {
            width: 100%;

            padding: 15px 16px;

            border-radius: 12px;

            border:
                1px solid #292929;

            outline: none;

            background: #111;

            color: white;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            border-color: #666;

            box-shadow:
                0 0 0 3px
                rgba(255, 255, 255, 0.05);
        }

        input:disabled {
            cursor: not-allowed;
        }

        #loginButton {
            width: 100%;

            margin-top: 14px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: white;

            color: black;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        #loginButton:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        #loginButton:active:not(:disabled) {
            transform: translateY(0);
        }

        #loginButton:disabled {
            cursor: not-allowed;

            opacity: 0.4;
        }

        .message {
            min-height: 20px;

            margin-top: 15px;

            font-size: 14px;
        }

        .back {
            display: inline-block;

            margin-top: 25px;

            color: #777;

            text-decoration: none;

            font-size: 14px;

            transition:
                color 0.2s ease;
        }

        .back:hover {
            color: white;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Owner Login</h1>

        <p class="subtitle">
            Sign in with Google to continue
        </p>


        <!-- GOOGLE SIGN-IN -->

        <div class="google-section">

            <div id="googleButton"></div>

            <div
                id="googleStatus"
                class="status"
            >
                Waiting for Google sign-in...
            </div>

        </div>


        <div class="divider">

            <span>
                OWNER ACCESS
            </span>

        </div>


        <!-- OWNER PASSWORD -->

        <div
            id="passwordSection"
            class="password-section"
        >

            <input
                id="password"
                type="password"
                placeholder="Owner password"
                disabled
                autocomplete="off"
            >

            <button
                id="loginButton"
                disabled
            >
                Unlock Owner Panel
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </div>


        <a
            class="back"
            href="../../login/"
        >
            ← Back to Login
        </a>

    </div>


    <!-- GOOGLE IDENTITY SERVICES -->

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
    ></script>


    <script>

        /*
         * GOOGLE CLIENT ID
         */

        const GOOGLE_CLIENT_ID =
            "263646768191-7854avn92k94rq8pbit809o0erq48grq.apps.googleusercontent.com";


        /*
         * CLOUDFLARE WORKER
         */

        const WORKER_URL =
            "https://archer.arcdepths.workers.dev/";


        /*
         * GOOGLE CREDENTIAL
         */

        let googleCredential = null;


        /*
         * ELEMENTS
         */

        const googleButton =
            document.getElementById(
                "googleButton"
            );

        const googleStatus =
            document.getElementById(
                "googleStatus"
            );

        const passwordSection =
            document.getElementById(
                "passwordSection"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        /*
         * GOOGLE LOGIN CALLBACK
         */

        function handleGoogleLogin(
            response
        ) {

            if (
                !response ||
                !response.credential
            ) {

                googleStatus.textContent =
                    "Google sign-in failed.";

                googleStatus.className =
                    "status error";

                return;
            }


            googleCredential =
                response.credential;


            /*
             * GOOGLE SUCCESS
             */

            googleStatus.textContent =
                "Google account verified ✓";

            googleStatus.className =
                "status success";


            /*
             * UNLOCK PASSWORD
             */

            passwordSection.classList.add(
                "unlocked"
            );

            passwordInput.disabled =
                false;

            loginButton.disabled =
                false;


            passwordInput.focus();


            /*
             * SAVE GOOGLE LOGIN STATE
             */

            try {

                localStorage.setItem(
                    "archer_google_logged_in",
                    "true"
                );

                localStorage.setItem(
                    "archer_google_credential",
                    googleCredential
                );

            } catch (error) {

                console.log(
                    "Could not save Google login state."
                );

            }

        }


        /*
         * INITIALIZE GOOGLE
         */

        window.addEventListener(
            "load",
            function() {

                if (
                    typeof google ===
                    "undefined"
                ) {

                    googleStatus.textContent =
                        "Google Sign-In could not load.";

                    googleStatus.className =
                        "status error";

                    return;
                }


                google.accounts.id.initialize({

                    client_id:
                        GOOGLE_CLIENT_ID,

                    callback:
                        handleGoogleLogin

                });


                google.accounts.id.renderButton(

                    googleButton,

                    {

                        theme:
                            "filled_black",

                        size:
                            "large",

                        width:
                            300,

                        text:
                            "signin_with",

                        shape:
                            "pill"

                    }

                );

            }
        );


        /*
         * OWNER LOGIN
         */

        loginButton.addEventListener(
            "click",
            async function() {

                const password =
                    passwordInput.value.trim();


                message.textContent = "";

                message.className =
                    "message";


                /*
                 * MAKE SURE GOOGLE LOGIN
                 * HAPPENED FIRST
                 */

                if (!googleCredential) {

                    message.textContent =
                        "Please sign in with Google first.";

                    message.className =
                        "message error";

                    return;

                }


                /*
                 * MAKE SURE PASSWORD EXISTS
                 */

                if (!password) {

                    message.textContent =
                        "Enter the owner password.";

                    message.className =
                        "message error";

                    passwordInput.focus();

                    return;

                }


                /*
                 * LOCK BUTTON WHILE
                 * REQUEST IS RUNNING
                 */

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Checking...";


                try {

                    const response =
                        await fetch(
                            WORKER_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        googleCredential:
                                            googleCredential,

                                        password:
                                            password

                                    })

                            }
                        );


                    /*
                     * READ WORKER RESPONSE
                     */

                    const data =
                        await response.json();


                    /*
                     * SUCCESS
                     */

                    if (
                        response.ok &&
                        data.success === true
                    ) {

                        message.textContent =
                            "Owner access granted ✓";

                        message.className =
                            "message success";


                        /*
                         * STORE OWNER LOGIN
                         */

                        localStorage.setItem(
                            "archer_owner_authenticated",
                            "true"
                        );


                        /*
                         * REDIRECT
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "/home/owner/";

                            },
                            500
                        );


                        return;

                    }


                    /*
                     * WORKER REJECTED LOGIN
                     */

                    message.textContent =
                        data.message ||
                        "Incorrect owner password.";

                    message.className =
                        "message error";


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Unlock Owner Panel";

                } catch (error) {

                    console.error(
                        "Owner authentication error:",
                        error
                    );


                    /*
                     * CONNECTION ERROR
                     */

                    message.textContent =
                        "Could not connect to the owner authentication server.";

                    message.className =
                        "message error";


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Unlock Owner Panel";

                }

            }
        );


        /*
         * ENTER KEY
         */

        passwordInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !loginButton.disabled
                ) {

                    loginButton.click();

                }

            }
        );

    </script>

</body>
</html>
