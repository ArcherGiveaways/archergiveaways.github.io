        body {

                #6cff9b !important;

<body>


<div class="login-box">

    <img
        src="/favicon.ico"
        alt="Archer Giveaways"
        class="logo"
    >


    <h1>
        Archer Giveaways
    </h1>


    <p class="subtitle">
        Sign in with Google to continue
    </p>


    <div id="googleButton"></div>


    <div id="status">
        Loading Google Login...
    </div>

</div>


<script>


/* ============================================================
   GOOGLE
============================================================ */

const GOOGLE_CLIENT_ID =
    "263646768191-7854avn92k94rq8pbit809o0erq48grq.apps.googleusercontent.com";


/* ============================================================
   CLEAR NORMAL SESSION
============================================================ */

function clearGoogleSession() {

    localStorage.removeItem(
        "archer_google_logged_in"
    );

    localStorage.removeItem(
        "archer_google_credential"
    );

    localStorage.removeItem(
        "archer_google_user"
    );

}


/* ============================================================
   GOOGLE CALLBACK
============================================================ */

function handleGoogleLogin(
    response
) {

    const status =
        document.getElementById(
            "status"
        );


    if (
        !response ||
        !response.credential
    ) {

        status.textContent =
            "Google login failed.";

        status.className =
            "error";

        return;

    }


    try {

        const credential =
            response.credential;


        const parts =
            credential.split(".");


        if (
            parts.length !== 3
        ) {

            throw new Error(
                "Invalid Google credential."
            );

        }


        const payload =
            JSON.parse(

                atob(

                    parts[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/")

                )

            );


        /*
         * Normal Google login must NEVER
         * create owner authentication.
         */

        localStorage.removeItem(
            "archer_owner_authenticated"
        );


        localStorage.setItem(
            "archer_google_logged_in",
            "true"
        );


        localStorage.setItem(
            "archer_google_credential",
            credential
        );


        localStorage.setItem(
            "archer_google_user",
            JSON.stringify(
                payload
            )
        );


        status.textContent =
            "Login successful ✓";

        status.className =
            "success";


        setTimeout(
            function () {

                window.location.replace(
                    "/home/"
                );

            },
            300
        );


    } catch (error) {

        console.error(
            "Google login error:",
            error
        );


        clearGoogleSession();


        status.textContent =
            "Unable to complete Google login.";

        status.className =
            "error";

    }

}


/* ============================================================
   INITIALIZE GOOGLE
============================================================ */

function initializeGoogle() {

    if (
        !window.google ||
        !window.google.accounts ||
        !window.google.accounts.id
    ) {

        document.getElementById(
            "status"
        ).textContent =
            "Google Login is still loading...";


        setTimeout(
            initializeGoogle,
            500
        );


        return;

    }


    google.accounts.id.initialize({

        client_id:
            GOOGLE_CLIENT_ID,

        callback:
            handleGoogleLogin,

        auto_select:
            false,

        cancel_on_tap_outside:
            false

    });


    google.accounts.id.renderButton(

        document.getElementById(
            "googleButton"
        ),

        {

            type:
                "standard",

            theme:
                "filled_blue",

            size:
                "large",

            text:
                "signin_with",

            shape:
                "rectangular",

            width:
                280

        }

    );


    document.getElementById(
        "status"
    ).textContent =
        "";

}


/* ============================================================
   ALREADY LOGGED IN
============================================================ */

if (
    localStorage.getItem(
        "archer_google_logged_in"
    ) === "true"
) {

    window.location.replace(
        "/home/"
    );

} else {

    initializeGoogle();

}

</script>


</body>
