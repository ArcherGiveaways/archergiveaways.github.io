
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Archer Giveaways - Owner</title>

    <link
        rel="icon"
        href="../favicon.ico"
    >

    <script>

    (function () {

        const ownerAuthenticated =
            localStorage.getItem(
                "archer_owner_authenticated"
            );


        if (
            ownerAuthenticated === "true"
        ) {

            window.location.replace(
                "../home/owner/"
            );

            return;

        }


        window.location.replace(
            "../login/owner/"
        );

    })();

    </script>

</head>

<body>

    <p>
        Loading Archer Giveaways Owner...
    </p>

</body>

</html>
