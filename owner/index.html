```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Archer Giveaways - Owner</title>

    <link
        rel="icon"
        href="../favicon.ico"
    >

    <script>

        (function () {

            /*
             * Check whether the owner has
             * successfully authenticated.
             */

            const ownerAuthenticated =
                localStorage.getItem(
                    "archer_owner_authenticated"
                );


            /*
             * Owner is authenticated.
             * Send them to the owner home page.
             */

            if (
                ownerAuthenticated === "true"
            ) {

                window.location.replace(
                    "../home/owner/"
                );

                return;
            }


            /*
             * Owner is not authenticated.
             * Send them to the owner login page.
             */

            window.location.replace(
                "../login/owner/"
            );

        })();

    </script>

</head>


<body>

    <p>
        Loading Archer Giveaways Owner...
    </p>

</body>

</html>
```
